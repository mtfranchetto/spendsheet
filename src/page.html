<!--
  page.html — the mobile app: the document, and the order its parts load in.

  The only `.html` files in `src/`, and the only ones `tests/harness.mjs` does
  not run: `node:vm` executes .gs, and anything inside a page is invisible to
  it. That is the whole reason 21_query.gs and 23_api.gs exist in the shape
  they do — every decision worth testing was pushed to the server, and what is
  left in here is drawing.

  **Assembled by the server, not by a build step.** `webAppHtml_` runs this
  file through `HtmlService.createTemplateFromFile`, and each `include_` below
  is resolved at that moment. There is nothing to compile and nothing that can
  be stale: `clasp push` sends these files and Apps Script joins them per
  request. `tests/page.mjs` resolves the same scriptlets in Node, which is what
  lets a file test see the whole page and a browser open it — `npm run preview`.

  **The partials are fragments of one closure, not files of their own.** The
  IIFE opens here and closes here; each `include_` pastes its lines inside it.
  So every function shares one scope exactly as it did when this was one file,
  no call site knows about the split, and the price is that a partial does not
  parse on its own — an unbalanced brace is a syntax error in the assembled
  document rather than in the file that caused it. `tests/page.test.mjs` parses
  the assembly for that reason, which is also the first check this project has
  ever had that the page runs at all.

  Order is load order, and it only has to satisfy one rule: a `var` must be
  assigned before anything *runs* that reads it. Function declarations hoist,
  so the call graph may point anywhere; `page.core` holds `state` and comes
  first, `page.boot` does the only work at load time and comes last.

  Three rules these files keep, each of them load-bearing:

  1. **No string is ever assigned as markup.** Every value on this page came
     out of a bank, and a bank's description field is not a thing to trust with
     markup on a Google origin, from where a script can reach
     `google.script.run` and call this project's functions as the deploying
     user. Nodes are created and `textContent` is assigned.

     `tests/manifest.test.mjs` fails on any of the five sinks appearing in an
     HTML file under `src/`, so this is a rule with a guard rather than a rule
     with a comment — and the guard is why this paragraph does not name them.
     The first draft did, and tripped its own check, which is exactly what the
     control-character rule did when it was written out quoting the character
     it warns about. Write the rule, not the token.

  2. **No CDN, no library.** A third-party script in the one page that renders
     bank balances is not worth what it saves. The two charts are hand-drawn:
     CSS bars for the category breakdown, an inline `<svg><polyline>` for the
     two series. Together they are about eighty lines.

  3. **One request per gesture.** Changing a filter costs a round trip;
     toggling what is *shown* costs nothing, because the server sends every
     block in one response. Results are cached against the filter signature, so
     going back to a slice you have already looked at is instant.
-->

<!--
  The first screen, already here.

  Written by `webAppHtml_` from `appInlineBoot_`, and read rather than fetched.
  A `google.script.run` call costs ~2,700ms of Apps Script startup before any
  of our code runs; `doGet` is an execution that has already paid it, so the
  top of the dashboard rides along with the document and draws on parse.

  `type="application/json"` so the browser never executes it, and every `<` in
  the payload is escaped server-side so nothing can close this element early.
  It says `null` if the server could not build it, and the boot below falls
  back to fetching — which is what it did before this existed.
-->
<script type="application/json" id="boot"><?!= boot ?></script>

<!--
  What this URL asked to see — the screen and the filters it was left on. See
  `webAppView_`, which owns the parameter names and every default.

  It rides in an element of its own rather than inside the boot payload above,
  because the two fail independently: `boot` says `null` whenever the inline
  dashboard could not be built, and a deep link must survive that. Same
  `application/json` for the same reason — the browser never executes it, and
  the filter values are the one part of this document that came off the URL.
-->
<script type="application/json" id="view"><?!= view ?></script>

<div id="screens"><div class="spinner">Loading…</div></div>

<nav id="tabs"></nav>
<div id="toast" hidden></div>
<div id="pull" hidden></div>
