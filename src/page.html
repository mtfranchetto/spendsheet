<!--
  page.html — the mobile app, in one file.

  The only .html in `src/`, and the only file here that `tests/harness.mjs`
  does not load: `node:vm` runs .gs, and anything inside a page is invisible to
  it. That is the whole reason 21_query.gs and 23_api.gs exist in the shape
  they do — every decision worth testing was pushed to the server, and what is
  left in here is drawing.

  Three rules this file keeps, each of them load-bearing:

  1. **No string is ever assigned as markup.** Every value on this page came
     out of a bank, and a bank's description field is not a thing to trust with
     markup on a Google origin, from where a script can reach
     `google.script.run` and call this project's functions as the deploying
     user. Nodes are created and `textContent` is assigned.

     `tests/manifest.test.mjs` fails on any of the five sinks appearing in an
     HTML file under `src/`, so this is a rule with a guard rather than a rule
     with a comment — and the guard is why this paragraph does not name them.
     The first draft did, and tripped its own check, which is exactly what the
     control-character rule did when it was written out quoting the character
     it warns about. Write the rule, not the token.

  2. **No CDN, no library.** A third-party script in the one page that renders
     bank balances is not worth what it saves. The two charts are hand-drawn:
     CSS bars for the category breakdown, an inline `<svg><polyline>` for the
     two series. Together they are about eighty lines.

  3. **One request per gesture.** Changing a filter costs a round trip;
     toggling what is *shown* costs nothing, because the server sends every
     block in one response. Results are cached against the filter signature, so
     going back to a slice you have already looked at is instant.
-->

<style>
  /*
    Custom properties in both themes, because a page opened at night should not
    be a white rectangle. The phone decides via prefers-color-scheme; there is
    no toggle, because a toggle is a preference to store and this page stores
    nothing.
  */
  :root {
    --bg: #ffffff;
    --surface: #f8f9fa;
    --line: #e8eaed;
    --text: #202124;
    --muted: #5f6368;
    --accent: #1a73e8;
    --bad: #c5221f;
    --bad-bg: #fce8e6;
    --warn: #b06000;
    --warn-bg: #fef7e0;
    --out: #d93025;
    --in: #188038;
    --radius: 12px;
    --tap: 44px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --surface: #202124;
      --line: #3c4043;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --bad: #f28b82;
      --bad-bg: #3b1f1e;
      --warn: #fdd663;
      --warn-bg: #3a2f14;
      --out: #f28b82;
      --in: #81c995;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* The tab bar is fixed to the bottom, so the scroll region owes it that much
     plus whatever the phone's home indicator takes. */
  #screens {
    padding: 12px 16px calc(76px + env(safe-area-inset-bottom, 0px));
    max-width: 900px;
    margin: 0 auto;
  }

  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 20px 0 8px; font-weight: 600; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .muted { color: var(--muted); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big { font-size: 28px; font-weight: 600; }
  .out { color: var(--out); }
  .in { color: var(--in); }

  .sev1 { border-left: 4px solid var(--warn); }
  .sev2 { border-left: 4px solid var(--bad); }

  .banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }

  /* The category breakdown. A bar is a div with a width, which on a narrow
     screen beats a pie by a distance — you compare lengths from a common
     baseline rather than angles. */
  .bar-track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; }
  .bar-fill { height: 6px; background: var(--accent); border-radius: 3px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .line { fill: none; stroke: var(--accent); stroke-width: 2;
          stroke-linejoin: round; stroke-linecap: round; }
  .barmark { fill: var(--out); }
  .barmark.up { fill: var(--in); }
  .spark { stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }

  button, select, input, textarea {
    font: inherit;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: var(--tap);
    max-width: 100%;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent);
                   font-weight: 600; width: 100%; }
  button.link { background: none; border: none; color: var(--accent); padding: 8px 0;
                min-height: auto; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .field { width: 100%; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters > * { flex: 1 1 45%; min-width: 130px; }

  /*
    Every control says what it filters.

    Two adjacent dropdowns both reading "All" is not a default, it is a
    guessing game — the value is the same and only the position distinguishes
    them, which is knowledge the screen refuses to show. The `aria-label` was
    already there and was doing this job for a screen reader only.
  */
  .fld { display: flex; flex-direction: column; gap: 3px; }
  .fld > select, .fld > input { width: 100%; }
  .flabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted); font-weight: 600; padding-left: 2px; }

  /* A row you can act on. 44px is the smallest thing a thumb hits reliably. */
  .tap {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 10px 6px; text-align: left; min-height: var(--tap);
  }
  .tap:last-child { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); flex: none; }
  .dot.hidden { visibility: hidden; }

  /*
    A spinner rather than the word "Loading…".

    A caption that never changes is indistinguishable from a page that has
    stopped, and the slowest moment here is the first paint on a phone that has
    just woken its radio. Motion is the only honest signal that something is
    still happening.

    Reduced motion gets a pulse rather than nothing at all: the preference is
    for less movement, not for losing the one cue that the app is alive.
  */
  .spinner { display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 12px; color: var(--muted);
             min-height: 45vh; padding: 24px 4px; }
  .spinner::before {
    content: ''; width: 18px; height: 18px; flex: none; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    .spinner::before { animation: pulse 1.4s ease-in-out infinite; }
  }

  /*
    Accounts as tiles rather than a list.

    A list row gives one tap target across the full width, which is fine to
    read and useless to act on. A tile is a thing you press, and pressing an
    account has an obvious meaning — show me what is in it. Two to a row on a
    phone, more on anything wider, so the grid rather than a fixed count.

    The tile is a `div` and the parts you can press are real buttons inside it:
    a cash account carries two different actions, and a button inside a button
    is not something a keyboard or a screen reader can make sense of.
  */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
           gap: 10px; margin-bottom: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: stretch;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px;
  }
  .tile button.face {
    background: none; border: none; border-radius: 0; padding: 0;
    min-height: auto; text-align: left; width: 100%;
    display: flex; flex-direction: column; gap: 2px;
  }
  .tile .who { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tile .amount { font-size: 19px; font-weight: 600; margin-top: 4px; }
  .tile .note { font-size: 12px; }
  .tile button.link { align-self: flex-start; margin-top: 6px; }

  /*
    A category and its subcategories, one list instead of two.

    The two flat blocks counted different things — a row with a category and no
    subcategory sat under its category in one and under "(uncategorised)" in
    the other — and side by side that reads as the app contradicting itself.
    Nested, "(uncategorised)" inside Food & Drink explains itself.
  */
  .catline { display: block; width: 100%; margin-bottom: 10px;
             background: none; border: none; border-radius: 0; padding: 0;
             min-height: auto; text-align: left; color: inherit; }
  .children { margin: -2px 0 12px 12px; padding-left: 10px;
              border-left: 2px solid var(--line); }
  .children .bar-fill { opacity: .55; }

  /*
    The stat cards on Charts: a label, the number, and the shape of it.

    A number alone answers "how much" and says nothing about whether that is
    normal. The thumbnail is too small to read a value off, which is the point
    — it carries the trend, and the full chart below carries the detail.
  */
  .stat { display: flex; align-items: center; gap: 12px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--muted); font-weight: 600; }
  .stat .value { font-size: 23px; font-weight: 600; }
  .stat .thumb { width: 62px; height: 38px; flex: none; overflow: visible; }

  /*
    Records grouped under the day they happened on.

    A date repeated down every row is a column of near-identical strings you
    read past; as a heading it is read once and orders everything under it.
  */
  .daygroup { margin-bottom: 12px; }
  .dayhead { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); font-weight: 600; margin: 14px 0 6px 2px; }

  /*
    The category as a coloured disc.

    The colour is derived from the name rather than stored: `categories` has an
    icon column and no colour one, and adding one would be a migration plus a
    thing to maintain for something a hash gives for free and identically on
    every device. The icon carries the meaning; the colour carries the
    at-a-glance grouping.
  */
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; position: relative; }
  .avatar .check { position: absolute; right: -3px; bottom: -3px;
                   width: 14px; height: 14px; border-radius: 50%;
                   background: var(--in); border: 2px solid var(--bg); }
  .rec-sub { color: var(--muted); font-size: 13px; }
  .rec-desc { color: var(--muted); font-size: 12px; }

  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: var(--bg); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 10;
  }
  #tabs button {
    flex: 1; border: none; background: none; border-radius: 0;
    padding: 8px 4px; font-size: 11px; color: var(--muted);
  }
  #tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  #tabs .glyph { display: block; font-size: 19px; line-height: 1.3; }

  #toast {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    background: var(--text); color: var(--bg);
    padding: 12px 14px; border-radius: 10px; font-size: 14px;
    z-index: 20;
  }
  #toast[hidden] { display: none; }

  dialog {
    border: none; border-radius: 16px 16px 0 0; padding: 16px;
    background: var(--bg); color: var(--text);
    width: 100%; max-width: 560px;
    margin: auto auto 0; /* a sheet from the bottom, which is where a thumb is */
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }

  .skeleton { color: var(--muted); padding: 24px 4px; }

  /* Above the fold on a laptop, the cards can sit side by side. Everything
     above this point assumed one column, which is the right default for the
     device this was built for. */
  @media (min-width: 700px) {
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cards .card { margin-bottom: 0; }
  }
</style>

<!--
  The first screen, already here.

  Written by `webAppHtml_` from `appInlineBoot_`, and read rather than fetched.
  A `google.script.run` call costs ~2,700ms of Apps Script startup before any
  of our code runs; `doGet` is an execution that has already paid it, so the
  top of the dashboard rides along with the document and draws on parse.

  `type="application/json"` so the browser never executes it, and every `<` in
  the payload is escaped server-side so nothing can close this element early.
  It says `null` if the server could not build it, and the boot below falls
  back to fetching — which is what it did before this existed.
-->
<script type="application/json" id="boot"><?!= boot ?></script>

<div id="screens"><div class="spinner">Loading…</div></div>

<nav id="tabs"></nav>
<div id="toast" hidden></div>

<script>
(function () {
  'use strict';

  // -------------------------------------------------------------------------
  // Making nodes
  // -------------------------------------------------------------------------

  /**
   * The one way anything gets onto this page.
   *
   * `textContent` for every string, without exception. A bank's description
   * field arrives here unaltered and this page runs on a Google origin, where
   * markup that executes can reach `google.script.run` and call this project's
   * functions as the account holding the bank credentials. Structural beats
   * careful: there is no escaping helper to remember to call, because there is
   * no path that would need one.
   */
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /** The waiting state, everywhere. The animation is in `.spinner::before`. */
  function spinner(message) {
    return el('div', 'spinner', message || 'Loading…');
  }

  // -------------------------------------------------------------------------
  // Formatting
  // -------------------------------------------------------------------------

  var state = {
    screen: 'dashboard',
    currency: 'EUR',
    lists: { accounts: [], cashAccounts: [], labels: [],
             categories: { parents: [], children: [] }, periods: [] },

    /*
      One filter set per screen, and they open on different periods on purpose.
      Charts answers "how is this month going", so it opens on this month.
      Records is the screen you go to *to find something*, and a ledger that
      searches only the last five days is not a ledger — a search for a shop
      you remember from March returning nothing is worse than slow, because it
      reads as the transaction not being there.
    */
    filters: {
      analytics: { period: { kind: 'mtd' }, account: 'All', label: 'All' },
      records: { period: { kind: 'last_12' }, account: 'All', label: 'All',
                 search: '', unconfirmedOnly: false }
    },
    data: {},

    /*
      What the round trip cost the *client*, which is not what the server
      reports. `describeDashboardCost` times the function; this times the whole
      journey — `google.script.run`'s transport and serialisation included —
      from the moment the page's script started running. The two differ, and
      the difference had never once been measured.

      It cannot see the part before that: the wrapper at script.google.com and
      the sandboxed iframe load ahead of this code, cross-origin, with no clock
      either side can share. Stopwatch minus `everything` is that number.
    */
    timing: { startedAt: Date.now(), open: 0, overview: 0,
              inlined: false, overviewInlined: false },
    // Keyed by the filter signature, so going back to a slice you have already
    // looked at is instant and costs no request.
    cache: {},
    // `loaded` rather than counting rows. Records is fetched on first
    // navigation now that the bootstrap no longer prefetches it, and a filter
    // that legitimately matches nothing would otherwise look exactly like a
    // screen that has never been opened — so every visit would re-fetch it.
    records: { rows: [], offset: 0, hasMore: false, total: 0, loading: false, loaded: false },
    // Which account a cash entry is being added to, set by the tile that
    // opened the form and read back by it as the default.
    addAccount: '',
    // Which categories are showing their subcategories. Keyed by name rather
    // than by position, so it survives the list re-ranking under a new filter.
    expanded: {},
    pending: {}
  };

  /**
   * Money, in the book's own currency.
   *
   * `Intl` rather than a hand-rolled formatter, because the separator and the
   * symbol's side are locale questions and this page is opened in it-IT. The
   * fallback matters: `Intl` will throw on a currency code it does not know,
   * and `base_currency` is a cell somebody can type into.
   */
  function money(value, options) {
    var opts = options || {};
    if (value === null || value === undefined || value === '') return '—';

    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency',
        currency: state.currency,
        maximumFractionDigits: opts.whole ? 0 : 2,
        minimumFractionDigits: opts.whole ? 0 : 2
      }).format(value);
    } catch (e) {
      return Number(value).toFixed(opts.whole ? 0 : 2) + ' ' + state.currency;
    }
  }

  /** `2026-08-06` as `6 Aug`, because the year is almost never the question. */
  function shortDate(key) {
    if (!key) return '';
    var parts = String(key).split('-');
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var month = months[Number(parts[1]) - 1] || parts[1];
    return parts.length > 2 ? Number(parts[2]) + ' ' + month : month + ' ' + parts[0];
  }

  function toast(message) {
    var node = document.getElementById('toast');
    node.textContent = message;
    node.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { node.hidden = true; }, 4000);
  }

  // -------------------------------------------------------------------------
  // Talking to the server
  // -------------------------------------------------------------------------

  /**
   * `google.script.run`, as a promise.
   *
   * The callback form nests badly once a screen needs two things, and every
   * failure path here has to end in a message a person can read — a rejected
   * promise with one `catch` is how that stays true as screens are added.
   */
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) {
          reject(new Error(error && error.message ? error.message : String(error)));
        })[name].apply(null, args);
    });
  }

  /** The filters, as a string, so a result can be cached against them. */
  function signature(filters) {
    return JSON.stringify([filters.period, filters.account, filters.label,
      filters.search || '', !!filters.unconfirmedOnly]);
  }

  // -------------------------------------------------------------------------
  // Charts, hand-drawn
  // -------------------------------------------------------------------------

  function svgNode(tag, attributes) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attributes || {}).forEach(function (key) {
      node.setAttribute(key, String(attributes[key]));
    });
    return node;
  }

  /**
   * A line, from a series of `{key, value}`.
   *
   * Drawn in a fixed 100×40 viewBox with `preserveAspectRatio="none"`, so the
   * SVG scales to whatever width the card is without any measuring in JS. The
   * stroke would scale with it and go lozenge-shaped, which is what
   * `vector-effect="non-scaling-stroke"` is for.
   *
   * A flat series is centred rather than drawn at the top: dividing by a zero
   * range gives Infinity, and a chart of one repeated value is a real answer
   * (an account nobody has touched all month) rather than an error.
   */
  function lineChart(series) {
    var box = el('div');
    if (!series || series.length < 2) {
      return add(box, el('p', 'muted', 'Not enough days to draw a line yet.'));
    }

    var values = series.map(function (point) { return point.value; });
    var low = Math.min.apply(null, values);
    var high = Math.max.apply(null, values);
    var range = high - low;

    var points = series.map(function (point, i) {
      var x = (i / (series.length - 1)) * 100;
      var y = range === 0 ? 20 : 38 - ((point.value - low) / range) * 36;
      return x.toFixed(2) + ',' + y.toFixed(2);
    }).join(' ');

    var svg = svgNode('svg', {
      viewBox: '0 0 100 40', preserveAspectRatio: 'none',
      role: 'img', 'aria-label': 'Trend from ' + series[0].key + ' to ' + series[series.length - 1].key
    });
    svg.style.height = '120px';

    add(svg, svgNode('line', { x1: 0, y1: 39.5, x2: 100, y2: 39.5, class: 'axis',
      'vector-effect': 'non-scaling-stroke' }));
    add(svg, svgNode('polyline', { points: points, class: 'line',
      'vector-effect': 'non-scaling-stroke' }));

    add(box, svg);

    // Each end labelled with **its own** value. The first draft paired the
    // first date with `low` and the last with `high`, which is right only for
    // a line that happens to be rising: a month where the balance fell showed
    // the starting date next to the lowest figure it reached, which is a
    // caption that contradicts the line above it.
    var first = series[0];
    var last = series[series.length - 1];
    return add(box, add(el('div', 'row'),
      el('span', 'muted', shortDate(first.key) + ' · ' + money(first.value, { whole: true })),
      el('span', 'muted', shortDate(last.key) + ' · ' + money(last.value, { whole: true }))));
  }

  /**
   * Cashflow, as bars from a zero line.
   *
   * Money out below the line and money in above it, because the shape of a
   * month is the question and a signed bar answers it at a glance where two
   * stacked series do not. The zero line moves with the data rather than
   * sitting in the middle: a month with no income at all should not waste half
   * the chart on the space where income would have been.
   */
  function barChart(buckets) {
    var box = el('div');
    if (!buckets || !buckets.length) {
      return add(box, el('p', 'muted', 'Nothing in this period.'));
    }

    var high = 0;
    var low = 0;
    buckets.forEach(function (bucket) {
      high = Math.max(high, bucket.income);
      low = Math.min(low, -bucket.expenses);
    });
    var span = high - low || 1;
    var zero = (high / span) * 40;

    var svg = svgNode('svg', {
      viewBox: '0 0 100 40', preserveAspectRatio: 'none',
      role: 'img', 'aria-label': buckets.length + ' periods of income and spending'
    });
    svg.style.height = '120px';

    var width = 100 / buckets.length;
    buckets.forEach(function (bucket, i) {
      [[-bucket.expenses, 'barmark'], [bucket.income, 'barmark up']].forEach(function (pair) {
        var value = pair[0];
        if (!value) return;
        var height = Math.abs(value / span) * 40;
        add(svg, svgNode('rect', {
          x: (i * width + width * 0.15).toFixed(2),
          y: (value < 0 ? zero : zero - height).toFixed(2),
          width: (width * 0.7).toFixed(2),
          height: Math.max(height, 0.4).toFixed(2),
          class: pair[1]
        }));
      });
    });
    add(svg, svgNode('line', { x1: 0, y1: zero.toFixed(2), x2: 100, y2: zero.toFixed(2),
      class: 'axis', 'vector-effect': 'non-scaling-stroke' }));

    add(box, svg);
    return add(box, add(el('div', 'row'),
      el('span', 'muted', shortDate(buckets[0].key)),
      el('span', 'muted', shortDate(buckets[buckets.length - 1].key))));
  }

  /**
   * A category's icon, from the lists the bootstrap already sends.
   *
   * Looked up by name rather than sent per row, because `byCategory` is keyed
   * by the category name and the icons are a list of about a dozen — joining
   * them on the server would put the same string in the response once per row
   * to save one lookup here. A subcategory falls through to nothing, which is
   * correct: only parents carry an icon that means anything at a glance.
   */
  function categoryIcon(name) {
    var found = state.lists.categories.parents.filter(function (entry) {
      return entry.name === name;
    })[0];
    return found ? found.icon : '';
  }

  /**
   * The category breakdown, as bars.
   *
   * The best form on a narrow screen: lengths from a common baseline, read
   * top to bottom, with the label and the number on the same line as the bar
   * rather than in a legend you have to look back and forth to.
   */
  function categoryBars(rows) {
    var box = el('div');
    if (!rows || !rows.length) {
      return add(box, el('p', 'muted', 'Nothing spent in this period.'));
    }

    var biggest = rows[0].total || 1;
    rows.forEach(function (row) {
      var children = row.children || [];
      var opens = children.length > 0;
      var open = opens && !!state.expanded[row.name];

      // A button only when there is something to open. A control that does
      // nothing is worse than no control: it is a promise the row cannot keep.
      var line = el(opens ? 'button' : 'div', 'catline');
      if (opens) {
        line.type = 'button';
        line.setAttribute('aria-expanded', open ? 'true' : 'false');
        line.addEventListener('click', function () {
          state.expanded[row.name] = !open;
          render();
        });
      }

      // The icon comes from the `categories` tab, which has carried one since
      // the tab was seeded — the page simply never asked for it. A dozen bars
      // in one colour are told apart by reading every label; with the icon the
      // one you are looking for is found before you read anything.
      var label = el('span', 'grow ellipsis');
      var icon = categoryIcon(row.name);
      if (icon) add(label, el('span', null, icon + ' '));
      add(label, document.createTextNode(row.name));
      if (opens) add(label, el('span', 'muted', open ? '  ▾' : '  ▸'));

      add(line, add(el('div', 'row'), label, el('span', 'num', money(row.total))));

      // The same hue the row's disc gets on Records, so a category looks like
      // itself wherever you meet it. One accent colour for twelve bars meant
      // the label was the only thing telling them apart, which is the work the
      // bar was supposed to be doing.
      var fill = el('div', 'bar-fill');
      fill.style.background = categoryColor(row.name);
      fill.style.width = Math.max(2, (row.total / biggest) * 100).toFixed(1) + '%';
      add(line, add(el('div', 'bar-track'), fill));
      add(box, line);

      if (!open) return;

      // Children are drawn against their *parent's* total, not the biggest
      // category's. The question a drill-down answers is "what is this category
      // made of", and a share of the whole screen cannot answer it — every bar
      // under a small category would be a sliver.
      var kids = el('div', 'children');
      children.forEach(function (child) {
        var kid = el('div');
        kid.style.marginBottom = '8px';
        add(kid, add(el('div', 'row'),
          add(el('span', 'grow ellipsis'), document.createTextNode(child.name)),
          el('span', 'num muted', money(child.total))));

        // The parent's hue, not the child's. A subcategory belongs to the
        // category it is nested under, and giving it a colour of its own would
        // say the opposite — the `.children` rule fades it instead.
        var kidFill = el('div', 'bar-fill');
        kidFill.style.background = categoryColor(row.name);
        kidFill.style.width =
          Math.max(2, (child.total / (row.total || 1)) * 100).toFixed(1) + '%';
        add(kid, add(el('div', 'bar-track'), kidFill));
        add(kids, kid);
      });
      add(box, kids);
    });
    return box;
  }

  /**
   * A colour for a category, derived rather than stored.
   *
   * `categories` carries an icon and no colour, and adding a colour column
   * would be a migration plus a thing to keep filled in — for something a hash
   * of the name gives free, stably, and identically on every device. Fixed
   * saturation and lightness so every disc reads at the same weight in both
   * themes; only the hue moves.
   */
  function categoryColor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + hash + ', 58%, 47%)';
  }

  // -------------------------------------------------------------------------
  // Screens
  // -------------------------------------------------------------------------

  var SCREENS = [
    { id: 'dashboard', label: 'Home', glyph: '\u{1F3E0}', render: renderDashboard },
    { id: 'records', label: 'Records', glyph: '\u{1F4C4}', render: renderRecords },
    { id: 'analytics', label: 'Charts', glyph: '\u{1F4CA}', render: renderAnalytics },
    { id: 'add', label: 'Add cash', glyph: '\u{2795}', render: renderAdd }
  ];

  /**
   * Which screens the tab bar offers, which is no longer all of them.
   *
   * Adding cash used to be a tab, and a tab is a claim about how often you
   * reach for something. You add cash from the account you spent it out of —
   * which is a tile on the dashboard, and which also answers the "into which
   * account" question the form would otherwise open by asking. So the screen
   * stays and the tab goes: `go('add')` still reaches it, from the one place
   * where it is already in context.
   */
  var NAV = ['dashboard', 'records', 'analytics'];

  /**
   * Draw what has arrived, rather than nothing until everything has.
   *
   * The screen used to be one call and one spinner, so the cheapest half of it
   * — net worth and the tiles, which need no ledger — waited on the most
   * expensive. Server time had come down from ~6,200ms to ~2,400 and the app
   * still felt slow, because **what a person experiences is when the first
   * real content appears, not when the last does.**
   *
   * So `open` and `overview` are fetched at the same time and each block draws
   * as its half lands. `open` is ~800ms and holds the top of the screen; the
   * rest keeps its own spinner until the ledger arrives, in place rather than
   * over the whole page, so nothing that is already on screen moves when it
   * does.
   */
  function renderDashboard(root) {
    var open = state.data.open;
    var data = state.data.overview;
    if (!open) return add(root, spinner());

    add(root, el('h1', null, 'Spendsheet'));

    (data ? data.health : []).forEach(function (alert) {
      var banner = el('div', 'banner ' + (alert.kind === 'consent' ? 'warn' : 'bad'));
      add(banner, el('div', null, alert.subject));
      add(banner, el('div', 'muted', alert.detail));
      add(root, banner);
    });

    // Net worth, then the accounts it is made of.
    //
    // The tiles were briefly first, on the argument that a total is not a thing
    // you can act on. True, and it turns out to be the wrong end to start from:
    // the total is what you open the app to see, and the tiles are what you
    // reach for once it has told you something. Summary then detail, which is
    // the order the rest of this screen already reads in.
    var worth = el('div', 'card');
    add(worth, el('div', 'muted', 'Net worth'));
    add(worth, el('div', 'big num', money(open.netWorth.total)));
    if (open.netWorth.skipped) {
      add(worth, el('div', 'muted',
        open.netWorth.skipped + ' account(s) not counted — either out of net worth, or not in ' +
        open.currency));
    }
    add(root, worth);

    add(root, el('h2', null, 'Accounts'));
    if (!open.accounts.length) {
      add(root, add(el('div', 'card'),
        el('p', 'muted', 'No accounts yet — connect a bank from the Sheet.')));
    } else {
      var tiles = el('div', 'tiles');
      open.accounts.forEach(function (account) {
        add(tiles, accountTile(account, open.currency));
      });
      add(root, tiles);
    }

    // Everything below here needs the ledger. One spinner in the flow, so the
    // blocks above do not move when it resolves.
    if (!data) {
      var pending = el('div', 'card');
      if (state.overviewError) {
        add(pending, el('div', 'muted', state.overviewError));
        add(pending, el('div', 'muted',
          'Net worth and balances above are current. Reload to try the rest again.'));
      } else {
        add(pending, spinner());
      }
      add(root, pending);
      return;
    }

    var month = el('div', 'card');
    add(month, add(el('div', 'row'),
      el('span', null, 'Spent since ' + shortDate(data.month.from)),
      el('span', 'num out', money(data.month.expenses))));
    add(month, add(el('div', 'row'),
      el('span', null, 'Earned'), el('span', 'num in', money(data.month.income))));
    add(month, add(el('div', 'row'),
      el('span', null, 'Net'),
      el('span', 'num ' + (data.month.net < 0 ? 'out' : 'in'), money(data.month.net))));

    // Month to date against month to date. A comparison that flatters you on
    // the 3rd and alarms you on the 30th is worse than none at all.
    var difference = data.month.expenses - data.month.lastMonthToDate;
    add(month, add(el('div', 'row'),
      el('span', 'muted', 'Same point last month'),
      el('span', 'num muted', money(data.month.lastMonthToDate) +
        '  (' + (difference >= 0 ? '+' : '') + money(difference) + ')')));
    add(root, month);

    add(root, el('h2', null, 'This month, by category'));
    add(root, add(el('div', 'card'), categoryBars(data.month.byCategory)));

    add(root, el('h2', null, 'Needs review'));
    var review = el('div', 'card');
    if (!data.review.length) {
      add(review, el('p', 'muted', 'Nothing waiting — every transaction is confirmed.'));
    }
    data.review.slice(0, 10).forEach(function (record) {
      add(review, recordRow(record));
    });
    if (data.review.length > 10) {
      var more = el('button', 'link', 'See all ' + data.review.length + ' in Records');
      more.addEventListener('click', function () {
        // Changing a filter and then navigating has to *reload*: `go` only
        // fetches when the screen has nothing on it, which after a first visit
        // is never — so without this the list arrives unfiltered and looks
        // like the toggle did nothing.
        state.filters.records.unconfirmedOnly = true;
        go('records');
        loadRecords();
      });
      add(review, more);
    }
    add(root, review);

    /*
      What the two calls cost this device, measured from the moment this
      script started running. Deliberately on the screen rather than in a
      console nobody opens on a phone.

      It cannot include the wrapper at script.google.com or the sandboxed
      iframe that loads ahead of this code — those are cross-origin and there
      is no clock both sides can read. Time the open by hand and subtract
      `everything`: what is left is Google's, and none of it is ours to fix.
    */
    add(root, el('p', 'muted',
      (state.timing.inlined
        ? 'Top of screen came with the page'
        : 'Top of screen in ' + (state.timing.open / 1000).toFixed(1) + 's') +
      ', ' + (state.timing.overviewInlined
        ? 'and so did the rest.'
        : 'everything in ' + (state.timing.overview / 1000).toFixed(1) + 's.')));
  }

  /**
   * An account's state as one character, rather than the word "ok".
   *
   * `accountState_` returns a sentence, and for a healthy account that sentence
   * is "ok" — a word repeated down the screen saying nothing, which is worse
   * than silence because it costs a line to read before you learn that. The
   * emoji carries the same fact pre-attentively: you see the one that is not
   * green without reading anything.
   *
   * Cash gets its own mark rather than a green one. A cash account has no
   * consent and no sync, so `accountState_` gives it severity 0 by definition —
   * calling that "healthy" would be reporting a check that never ran.
   */
  function accountEmoji(account) {
    if (isCashAccount(account.name)) return '\u{1F4B5}';
    if (account.severity === 2) return '\u{1F534}';
    if (account.severity === 1) return '\u{1F7E0}';
    return '\u{1F7E2}';
  }

  /** The server already knows which accounts take cash entries; it sends the list. */
  function isCashAccount(name) {
    return state.lists.cashAccounts.indexOf(name) !== -1;
  }

  /**
   * One account, as something you can press.
   *
   * The tile is a `div` and the two things you can do to it are real buttons
   * inside it. Pressing the face means "show me what is in this account", which
   * is the only question a balance ever prompts; a cash account gets a second,
   * smaller action because it is the only kind you can add to by hand.
   *
   * Nesting a button inside a button would be neither — a keyboard reaches one
   * of them and a screen reader announces something that does not exist.
   */
  function accountTile(account, currency) {
    var tile = el('div', 'tile' + (account.severity ? ' sev' + account.severity : ''));

    var face = el('button', 'face');
    face.type = 'button';

    var who = el('div', 'who');
    add(who, el('span', null, accountEmoji(account)));
    add(who, add(el('div', 'ellipsis grow'), document.createTextNode(account.name)));
    add(face, who);

    add(face, el('div', 'amount num', account.balance === null
      ? '—'
      : money(account.balance) +
        (account.currency === currency ? '' : ' ' + account.currency)));

    // Only when it says something. "ok" and "—" are the two answers worth no line.
    if (account.severity) add(face, el('div', 'muted note', account.sync));

    face.setAttribute('aria-label', 'Show records for ' + account.name +
      (account.severity ? '. ' + account.sync : ''));
    face.addEventListener('click', function () {
      // Same reload the review queue's "see all" needs: `go` only fetches a
      // screen that has nothing on it, so after a first visit the filter would
      // change and the list would not.
      state.filters.records.account = account.name;
      state.filters.records.unconfirmedOnly = false;
      go('records');
      loadRecords();
    });
    add(tile, face);

    if (isCashAccount(account.name)) {
      var entry = el('button', 'link', '+ Add cash');
      entry.type = 'button';
      entry.addEventListener('click', function () {
        state.addAccount = account.name;
        go('add');
      });
      add(tile, entry);
    }

    return tile;
  }

  /**
   * One transaction, as a button.
   *
   * A button rather than a div with a click handler, because a button is what
   * a screen reader announces as actionable and what a keyboard reaches with
   * Tab. The dot on the left is the unconfirmed marker — a shape rather than
   * only a colour, since colour alone is not a signal everyone receives.
   */
  function recordRow(record) {
    var button = el('button', 'tap');
    button.type = 'button';

    // What this was, then where it came from, then what the bank called it.
    //
    // The description used to lead, and a bank's description is the least
    // readable field it sends — "ADDEBITO UNIPOLMOVE - N 555012345/2026" tells
    // you nothing at a glance that "Transport" does not. It stays, third,
    // because it is the only line that distinguishes two rows in the same
    // category on the same day.
    var what = record.subcategory || record.category || '(uncategorised)';

    var avatar = el('div', 'avatar');
    avatar.style.background = categoryColor(record.category || what);
    avatar.setAttribute('aria-hidden', 'true');
    add(avatar, document.createTextNode(categoryIcon(record.category) || ''));
    if (record.confirmed) add(avatar, el('span', 'check'));
    add(button, avatar);

    var middle = el('div', 'grow');
    add(middle, add(el('div', 'ellipsis'), document.createTextNode(what)));
    add(middle, el('div', 'rec-sub', record.account));
    if (record.description) {
      add(middle, add(el('div', 'rec-desc ellipsis'),
        document.createTextNode(record.description)));
    }
    add(button, middle);

    add(button, el('span', 'num ' + (record.amount < 0 ? 'out' : 'in'),
      record.amount === null ? '—' : money(record.amount)));

    button.setAttribute('aria-label',
      (record.confirmed ? 'Confirmed. ' : 'Needs review. ') + what + ', ' +
      shortDate(record.date) + ', ' + record.account + ', ' + money(record.amount) +
      (record.description ? '. ' + record.description : ''));
    button.addEventListener('click', function () { openSheet(record); });
    return button;
  }

  /**
   * The rows as consecutive runs of the same day.
   *
   * A run rather than a map keyed by date: the server has already sorted the
   * page newest first, and re-grouping through an object would lose that order
   * on the way through `Object.keys`. This preserves whatever order it was
   * handed and only inserts a boundary where the day changes — which also
   * means a page break mid-day produces two headings, correctly, rather than
   * one heading with a gap in it.
   */
  function groupByDay(rows) {
    var days = [];
    (rows || []).forEach(function (record) {
      var last = days[days.length - 1];
      if (last && last.key === record.date) last.rows.push(record);
      else days.push({ key: record.date, rows: [record] });
    });
    return days;
  }

  /** `2026-08-06` as `6 AUGUST`, or `TODAY` when it is. */
  function dayHeading(key) {
    if (!key) return 'No date';
    if (key === state.data.generatedAt) return 'Today';

    var parts = key.split('-');
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if (isNaN(date.getTime())) return key;

    return date.getDate() + ' ' +
      date.toLocaleDateString(undefined, { month: 'long' }) +
      (date.getFullYear() === new Date().getFullYear() ? '' : ' ' + date.getFullYear());
  }

  function renderRecords(root) {
    add(root, el('h1', null, 'Records'));
    add(root, filterBar('records', { search: true, unconfirmed: true }));

    var list = el('div', 'card');
    if (!state.records.rows.length) {
      add(list, state.records.loading
        ? spinner()
        : el('p', 'muted', 'Nothing matches those filters.'));
    }
    groupByDay(state.records.rows).forEach(function (day) {
      var group = el('div', 'daygroup');
      add(group, el('div', 'dayhead', dayHeading(day.key)));
      day.rows.forEach(function (record) { add(group, recordRow(record)); });
      add(list, group);
    });
    add(root, list);

    add(root, el('p', 'muted',
      state.records.rows.length + ' of ' + state.records.total));

    if (state.records.hasMore) {
      var more = el('button', 'primary', state.records.loading ? 'Loading…' : 'Load more');
      more.disabled = state.records.loading;
      more.addEventListener('click', loadMoreRecords);
      add(root, more);
    }
  }

  /** A headline number with the shape of it beside it. */
  function statCard(label, value, thumb) {
    var card = el('div', 'card');
    var stat = el('div', 'stat');

    var left = el('div', 'grow');
    add(left, el('div', 'label', label));
    add(left, el('div', 'value num', value));
    add(stat, left);
    add(stat, thumb);

    return add(card, stat);
  }

  /** The balance line, small enough that only its direction survives. */
  function sparkline(series) {
    var svg = svgNode('svg', { class: 'thumb', viewBox: '0 0 100 40',
      preserveAspectRatio: 'none' });
    if (!series || series.length < 2) return svg;

    var values = series.map(function (point) { return point.value; });
    var low = Math.min.apply(null, values);
    var span = (Math.max.apply(null, values) - low) || 1;

    add(svg, svgNode('polyline', {
      fill: 'none', class: 'spark', 'vector-effect': 'non-scaling-stroke',
      points: series.map(function (point, i) {
        return ((i / (series.length - 1)) * 100).toFixed(1) + ',' +
          (38 - ((point.value - low) / span) * 36).toFixed(1);
      }).join(' ')
    }));
    return svg;
  }

  /**
   * Spending split by category, as a ring.
   *
   * A radius of 15.915 gives a circumference of almost exactly 100, so a
   * slice's share *is* its `stroke-dasharray` — no arc paths and no
   * trigonometry. Five slices, because a ring 62 pixels wide cannot show more
   * than that as anything but a texture.
   */
  function donut(rows) {
    var svg = svgNode('svg', { class: 'thumb', viewBox: '0 0 42 42' });
    var slices = (rows || []).slice(0, 5);
    var total = slices.reduce(function (sum, row) { return sum + row.total; }, 0);
    if (!total) return svg;

    var offset = 0;
    slices.forEach(function (row) {
      var share = (row.total / total) * 100;
      add(svg, svgNode('circle', {
        cx: 21, cy: 21, r: 15.915, fill: 'none', 'stroke-width': 6,
        stroke: categoryColor(row.name),
        'stroke-dasharray': share.toFixed(2) + ' ' + (100 - share).toFixed(2),
        'stroke-dashoffset': (25 - offset).toFixed(2)
      }));
      offset += share;
    });
    return svg;
  }

  /** In against out, which is the whole of what a cashflow number means. */
  function flowThumb(totals) {
    var svg = svgNode('svg', { class: 'thumb', viewBox: '0 0 100 40' });
    var biggest = Math.max(totals.income, totals.expenses, 1);

    [[totals.income, 5, 'barmark up'], [totals.expenses, 22, 'barmark']]
      .forEach(function (bar) {
        add(svg, svgNode('rect', { x: 0, y: bar[1], height: 13, rx: 3,
          width: Math.max(3, (bar[0] / biggest) * 100).toFixed(1), class: bar[2] }));
      });
    return svg;
  }

  function renderAnalytics(root) {
    add(root, el('h1', null, 'Charts'));
    add(root, filterBar('analytics', {}));

    var data = state.data.analytics;
    if (!data) return add(root, spinner());

    add(root, el('div', 'muted',
      shortDate(data.window.from) + ' — ' + shortDate(data.window.to)));

    // Three answers, biggest first, each with its shape next to it. The full
    // charts are below; these are what you read without scrolling.
    add(root, statCard('Balance', money(data.netWorth.total), sparkline(data.balance)));
    add(root, statCard('Spending', money(data.totals.expenses), donut(data.byCategory)));
    add(root, statCard('Cash flow', money(data.totals.net), flowThumb(data.totals)));

    if (data.totals.unconvertible) {
      add(root, add(el('div', 'card'), el('div', 'muted', data.totals.unconvertible +
        ' row(s) left out — no ' + data.currency + ' amount for them.')));
    }

    add(root, el('h2', null, 'Cashflow'));
    add(root, add(el('div', 'card'), barChart(data.cashflow)));

    add(root, el('h2', null, 'Net worth'));
    add(root, add(el('div', 'card'), lineChart(data.balance)));

    // One list, not two. `bySubcategory` is still sent and still ranks
    // globally, but showing it beside its parent invited the comparison it
    // cannot survive — see `nestedTotals_` for why the two disagree.
    add(root, el('h2', null, 'By category'));
    add(root, add(el('div', 'card'), categoryBars(data.byCategory)));
  }

  /**
   * The filter bar, shared by Records and Charts.
   *
   * Applied on change rather than per keystroke — a request per character
   * typed into the search box is a queue of responses arriving out of order,
   * and the last one to land wins whether or not it is the one you asked for.
   * The search box therefore fires on `change`, which on a phone is when the
   * keyboard is dismissed.
   */
  function filterBar(which, options) {
    var filters = state.filters[which];
    var bar = el('div', 'filters');

    var period = el('select');
    period.setAttribute('aria-label', 'Period');
    state.lists.periods.forEach(function (entry) {
      var option = el('option', null, entry.label);
      option.value = entry.kind;
      if (entry.kind === filters.period.kind) option.selected = true;
      add(period, option);
    });
    period.addEventListener('change', function () {
      filters.period = period.value === 'custom'
        ? { kind: 'custom', from: filters.period.from, to: filters.period.to }
        : { kind: period.value };
      refreshCurrentScreen();
    });
    add(bar, labelled('Period', period));

    add(bar, pickList('Account', state.lists.accounts, filters.account, function (value) {
      filters.account = value;
      refreshCurrentScreen();
    }));

    add(bar, pickList('Label', state.lists.labels, filters.label, function (value) {
      filters.label = value;
      refreshCurrentScreen();
    }));

    if (filters.period.kind === 'custom') {
      ['from', 'to'].forEach(function (edge) {
        var input = el('input');
        input.type = 'date';
        input.className = 'field';
        input.setAttribute('aria-label', 'Custom ' + edge);
        input.value = filters.period[edge] || '';
        input.addEventListener('change', function () {
          filters.period[edge] = input.value;
          refreshCurrentScreen();
        });
        add(bar, labelled(edge === 'from' ? 'From' : 'To', input));
      });
    }

    if (options.search) {
      var search = el('input');
      search.type = 'search';
      search.className = 'field';
      search.placeholder = 'Search';
      search.setAttribute('aria-label', 'Search descriptions');
      search.value = filters.search || '';
      search.addEventListener('change', function () {
        filters.search = search.value;
        refreshCurrentScreen();
      });
      add(bar, labelled('Search', search));
    }

    if (options.unconfirmed) {
      var toggle = el('button', null,
        filters.unconfirmedOnly ? 'Showing: needs review' : 'Showing: everything');
      toggle.addEventListener('click', function () {
        filters.unconfirmedOnly = !filters.unconfirmedOnly;
        refreshCurrentScreen();
      });
      add(bar, toggle);
    }

    return bar;
  }

  /** A `<select>` with `All` on top, which is the default and the common answer. */
  /** A control with its name above it. */
  function labelled(text, control) {
    var field = el('div', 'fld');
    add(field, el('span', 'flabel', text));
    add(field, control);
    return field;
  }

  function pickList(label, values, chosen, onChange) {
    var select = el('select');
    select.setAttribute('aria-label', label);

    ['All'].concat(values).forEach(function (value) {
      var option = el('option', null, value);
      option.value = value;
      if (value === chosen) option.selected = true;
      add(select, option);
    });
    select.addEventListener('change', function () { onChange(select.value); });
    return labelled(label, select);
  }

  // -------------------------------------------------------------------------
  // Acting on a row
  // -------------------------------------------------------------------------

  /**
   * The confirm/categorise sheet, from the bottom.
   *
   * The same three columns the `review` tab offers and in the same order:
   * confirm the guess, or pick a subcategory instead. Picking a subcategory
   * names its parent on its own — `Groceries` means Food & Drink — which is
   * why there is one picker here rather than two, and why the category picker
   * is behind "no subcategory fits".
   *
   * Optimistic: the row is redrawn as confirmed before the server answers, and
   * put back if it refuses. On a phone that is the difference between a list
   * that responds and one you wait for.
   */
  function openSheet(record) {
    var dialog = document.getElementById('sheet') || el('dialog');
    dialog.id = 'sheet';
    clear(dialog);
    if (!dialog.isConnected) document.body.appendChild(dialog);

    add(dialog, el('h2', null, record.description || '(no description)'));
    add(dialog, el('p', 'muted', shortDate(record.date) + ' · ' + record.account + ' · ' +
      money(record.amount)));
    add(dialog, el('p', 'muted', record.category
      ? 'Currently ' + record.category + (record.subcategory ? ' › ' + record.subcategory : '') +
        (record.source ? ' (' + record.source + ')' : '')
      : 'Not categorised.'));

    add(dialog, el('label', null, 'Change the subcategory'));
    var child = el('select');
    child.className = 'field';
    add(child, el('option', null, 'Leave as it is'));
    state.lists.categories.children.forEach(function (entry) {
      var option = el('option', null,
        (entry.icon ? entry.icon + '  ' : '') + entry.name + '  —  ' + entry.parent);
      option.value = entry.name;
      add(child, option);
    });
    add(dialog, child);

    add(dialog, el('label', null, 'Or set only the category'));
    var parent = el('select');
    parent.className = 'field';
    add(parent, el('option', null, 'Leave as it is'));
    state.lists.categories.parents.forEach(function (entry) {
      var option = el('option', null, (entry.icon ? entry.icon + '  ' : '') + entry.name);
      option.value = entry.name;
      add(parent, option);
    });
    add(dialog, parent);

    var confirm = el('button', 'primary', record.confirmed ? 'Save' : 'Confirm');
    confirm.style.marginTop = '16px';
    confirm.addEventListener('click', function () {
      var decision = { uid: record.uid, confirmed: true };
      if (child.value && child.selectedIndex > 0) decision.subcategory_override = child.value;
      if (parent.value && parent.selectedIndex > 0) decision.category_override = parent.value;

      dialog.close();
      sendDecision(record, decision);
    });
    add(dialog, confirm);

    var cancel = el('button', 'link', 'Cancel');
    cancel.addEventListener('click', function () { dialog.close(); });
    add(dialog, cancel);

    dialog.showModal();
  }

  function sendDecision(record, decision) {
    // Optimistic, and the local copies are what get redrawn — the server's own
    // view is refetched afterwards rather than assumed.
    record.confirmed = true;
    if (decision.subcategory_override) record.subcategory = decision.subcategory_override;
    if (decision.category_override) record.category = decision.category_override;
    render();

    call('appConfirm', [decision]).then(function (result) {
      var outcome = (result.results || [])[0];
      if (outcome && !outcome.ok) {
        toast('Not saved: ' + outcome.reason);
        record.confirmed = false;
      } else {
        toast('Saved.');
      }
      // The derived columns are formulas, so what a confirmation *means* is
      // only knowable by asking the sheet again.
      invalidate();
      loadDashboard();
    }).catch(function (error) {
      record.confirmed = false;
      toast(error.message);
      render();
    });
  }

  // -------------------------------------------------------------------------
  // Add
  // -------------------------------------------------------------------------

  /**
   * A cash transaction.
   *
   * Type the amount without a sign — a bare number is spending, and an Income
   * or Transfer category flips it. That rule lives in `cashEntryAmount` on the
   * server and this form does not reimplement it; the hint is here because the
   * form is where you would otherwise wonder.
   */
  function renderAdd(root) {
    // No tab reaches this screen any more, so it owes you the way back that a
    // tab bar used to be.
    var back = el('button', 'link', '\u{2190} Home');
    back.type = 'button';
    back.addEventListener('click', function () { go('dashboard'); });
    add(root, back);

    add(root, el('h1', null, 'Add cash'));

    if (!state.lists.cashAccounts.length) {
      return add(root, add(el('div', 'card'),
        el('p', 'muted', 'No cash accounts yet. Add a row to the accounts tab with ' +
          'kind set to cash, then reload.')));
    }

    var form = el('div', 'card');

    add(form, el('label', null, 'Amount'));
    var amount = el('input');
    amount.type = 'text';
    // `inputmode` rather than `type=number`: a decimal-comma keyboard produces
    // `3,50`, which a number input silently discards rather than rejecting.
    amount.inputMode = 'decimal';
    amount.className = 'field';
    amount.placeholder = '3.50';
    add(form, amount);
    add(form, el('div', 'muted',
      'No sign. A bare number is spending; an Income or Transfer category flips it.'));

    add(form, el('label', null, 'Account'));
    var account = el('select');
    account.className = 'field';
    state.lists.cashAccounts.forEach(function (name) {
      var option = el('option', null, name);
      option.value = name;
      // Arriving from a tile already answers this question, so the form does
      // not ask it again — it shows the answer, still changeable.
      if (name === state.addAccount) option.selected = true;
      add(account, option);
    });
    add(form, account);

    add(form, el('label', null, 'Subcategory'));
    var category = el('select');
    category.className = 'field';
    add(category, el('option', null, 'Uncategorised'));
    state.lists.categories.children.forEach(function (entry) {
      var option = el('option', null,
        (entry.icon ? entry.icon + '  ' : '') + entry.name + '  —  ' + entry.parent);
      option.value = entry.name;
      option.dataset.parent = entry.parent;
      add(category, option);
    });
    add(form, category);

    add(form, el('label', null, 'Date'));
    var date = el('input');
    date.type = 'date';
    date.className = 'field';
    date.value = state.data.generatedAt || '';
    add(form, date);

    add(form, el('label', null, 'Note'));
    var note = el('input');
    note.type = 'text';
    note.className = 'field';
    add(form, note);

    var submit = el('button', 'primary', 'Add');
    submit.style.marginTop = '16px';
    submit.addEventListener('click', function () {
      var chosen = category.options[category.selectedIndex];
      submit.disabled = true;
      submit.textContent = 'Adding…';

      call('appAddCash', {
        amount: amount.value.replace(',', '.'),
        account: account.value,
        subcategory: category.selectedIndex > 0 ? category.value : '',
        category: category.selectedIndex > 0 ? chosen.dataset.parent : '',
        date: date.value,
        note: note.value
      }).then(function (result) {
        // `inserted` is not necessarily *your* row: the drain takes every
        // complete unprocessed one, including a half-typed entry sitting on
        // the Sheets tab. So the message says how many landed, not "added".
        toast(result.message);
        amount.value = '';
        note.value = '';
        submit.disabled = false;
        submit.textContent = 'Add';
        invalidate();
        loadDashboard();
      }).catch(function (error) {
        toast(error.message);
        submit.disabled = false;
        submit.textContent = 'Add';
      });
    });
    add(form, submit);
    add(root, form);
  }

  // -------------------------------------------------------------------------
  // Loading and drawing
  // -------------------------------------------------------------------------

  function invalidate() {
    state.cache = {};
  }

  function currentFilters(which) {
    var filters = state.filters[which];
    return {
      period: filters.period,
      account: filters.account,
      label: filters.label,
      search: filters.search || '',
      unconfirmedOnly: !!filters.unconfirmedOnly
    };
  }

  function refreshCurrentScreen() {
    render();
    if (state.screen === 'analytics') loadAnalytics();
    if (state.screen === 'records') loadRecords();
  }

  function loadAnalytics() {
    var filters = currentFilters('analytics');
    var key = 'analytics:' + signature(filters);
    if (state.cache[key]) {
      state.data.analytics = state.cache[key];
      return render();
    }

    state.data.analytics = null;
    render();

    call('appAnalytics', filters).then(function (result) {
      state.cache[key] = result;
      state.data.analytics = result;
      render();
    }).catch(fail);
  }

  function loadRecords() {
    // Clear the rows, not just set the flag. This is a fresh query from offset
    // zero, so what is on screen belongs to the *previous* filter — and the
    // spinner only shows on an empty list, so leaving them there meant a filter
    // change repainted the old answer with no sign anything was happening.
    // `loadMoreRecords` is the one that must keep them: it appends.
    state.records = { rows: [], offset: 0, hasMore: false, total: 0,
      loading: true, loaded: false };
    render();

    call('appRecords', currentFilters('records'), 0).then(function (result) {
      state.records = { rows: result.rows, offset: result.rows.length,
        hasMore: result.hasMore, total: result.total, loading: false, loaded: true };
      render();
    }).catch(fail);
  }

  function loadMoreRecords() {
    state.records.loading = true;
    render();

    call('appRecords', currentFilters('records'), state.records.offset).then(function (result) {
      state.records.rows = state.records.rows.concat(result.rows);
      state.records.offset += result.rows.length;
      state.records.hasMore = result.hasMore;
      state.records.total = result.total;
      state.records.loading = false;
      render();
    }).catch(fail);
  }

  /**
   * Re-read the dashboard after a write, through the call that drops the cache.
   *
   * One call rather than the two the boot makes: this runs after you have
   * already been looking at the screen, so there is no first paint left to
   * win, and the write that prompted it has bumped the data version anyway.
   * The result is the union of both halves, distributed back into them.
   */
  function loadDashboard() {
    call('appDashboard').then(function (result) {
      state.data.open = {
        currency: result.currency,
        netWorth: result.netWorth,
        accounts: result.accounts,
        lists: state.data.open.lists,
        generatedAt: state.data.generatedAt
      };
      state.data.overview = {
        month: result.month,
        health: result.health,
        review: result.review,
        lists: state.data.overview ? state.data.overview.lists : state.lists
      };
      state.overviewError = '';
      render();
    }).catch(fail);
  }

  function fail(error) {
    state.records.loading = false;
    toast(error.message);
    render();
  }

  function go(id) {
    state.screen = id;
    render();
    if (id === 'analytics' && !state.data.analytics) loadAnalytics();
    if (id === 'records' && !state.records.loaded) loadRecords();
    window.scrollTo(0, 0);
  }

  function render() {
    var root = clear(document.getElementById('screens'));
    var screen = SCREENS.filter(function (entry) { return entry.id === state.screen; })[0];
    screen.render(root);

    var tabs = clear(document.getElementById('tabs'));
    SCREENS.filter(function (entry) {
      return NAV.indexOf(entry.id) !== -1;
    }).forEach(function (entry) {
      var button = el('button');
      button.type = 'button';
      if (entry.id === state.screen) button.setAttribute('aria-current', 'page');
      add(button, el('span', 'glyph', entry.glyph));
      add(button, document.createTextNode(entry.label));
      button.addEventListener('click', function () { go(entry.id); });
      add(tabs, button);
    });
  }

  /**
   * Two calls, fired together, drawn as they land.
   *
   * This was one call, and before that one call carrying Charts and Records
   * too — a boot that read the ledger three times for screens you might never
   * open. Removing the prefetch was right and it was not enough: the remaining
   * call still bundled the cheap half of the dashboard with the expensive one,
   * so net worth and the tiles waited ~1,600ms on a ledger they do not use.
   *
   * In parallel, and that was settled by measuring rather than by reasoning.
   *
   * They were briefly made sequential, on the theory that two executions
   * reading the same spreadsheet contend and the cheap call would not finish
   * first anyway. The evidence for it was "the whole screen arrives at once" —
   * observed on a deployment that turned out to predate the split entirely and
   * was making a single call. An inference drawn from a build that could not
   * have staged anything.
   *
   * Measured against the live app, in one session, both orders back to back:
   *
   *     sequential ... first paint 3,206ms, everything 7,710ms
   *     parallel ..... first paint 3,588ms, everything 3,916ms
   *
   * They do not contend — `appOverview` came back *sooner* running alongside
   * `appOpen` (3,916ms) than after it (4,504ms). Sequential nearly doubles the
   * total and buys nothing.
   *
   * The reason the two are so close is the finding under all of this: a
   * `google.script.run` round trip costs about **2,700ms before any of our
   * code runs** — `appOpen` does ~800ms of work on the server and takes
   * ~3,500ms from here, twice in a row, within 10ms of itself. Overlapping
   * that fixed cost is worth far more than removing server work from either
   * call.
   *
   * A failure before `appOpen` lands is fatal — it carries the gate's verdict
   * and there is nothing to draw without it. A failure after it is not: what
   * is on screen is still true.
   */
  var fatal = function (error) {
    // Which half failed decides what this means, and `state.data.open` is how
    // you tell. Before it lands there is nothing on screen and nothing to say
    // but the error — it carries the gate's verdict, so "Not available" is the
    // likely one. After it lands, net worth and the balances are up and still
    // true, and replacing a working screen with an error would be a lie about
    // what is known.
    if (state.data.open) {
      state.overviewError = error.message;
      return render();
    }

    var root = clear(document.getElementById('screens'));
    add(root, el('h1', null, 'Spendsheet'));
    add(root, add(el('div', 'banner bad'), el('div', null, error.message)));
    add(root, el('p', 'muted',
      'If this says "Not available", you are signed in as a different Google account. ' +
      'Switch accounts and reload.'));
  };

  function applyOpen(result, inlined) {
    state.currency = result.currency;
    state.lists.accounts = result.lists.accounts;
    state.lists.cashAccounts = result.lists.cashAccounts;
    state.data.open = result;
    state.data.generatedAt = result.generatedAt;
    state.timing.open = inlined ? 0 : Date.now() - state.timing.startedAt;
    state.timing.inlined = !!inlined;
    render();
  }

  /**
   * The first screen, if the server sent it with the page.
   *
   * Every failure here returns null and the fetch below happens instead — a
   * missing element, `null` because the server could not build it, or JSON that
   * will not parse. There is no case where a broken payload is worth more than
   * a round trip.
   */
  function inlinedBoot() {
    try {
      var node = document.getElementById('boot');
      var raw = node ? String(node.textContent || '').trim() : '';
      if (!raw || raw === 'null') return null;

      var parsed = JSON.parse(raw);
      // `open` is the half that is always there; `overview` rides along only
      // when the ledger was already cached. A payload missing the fields the
      // tiles are built from is treated as absent — a broken screen is worse
      // than a slow one.
      if (!parsed || !parsed.open || !parsed.open.lists || !parsed.open.accounts) return null;
      return parsed;
    } catch (e) {
      return null;
    }
  }

  var inline = inlinedBoot();
  if (inline) {
    applyOpen(inline.open, true);
  } else {
    call('appOpen').then(function (result) { applyOpen(result, false); }).catch(fatal);
  }

  function applyOverview(result, inlined) {
    state.lists.labels = result.lists.labels;
    state.lists.categories = result.lists.categories;
    state.lists.periods = result.lists.periods;
    state.data.overview = result;

    // The first view of the other two screens, computed on the server from
    // rows it already had. Seeded through the same cache a fetch would fill,
    // and keyed on the server's own defaults — so `go()` finds them present
    // and asks for nothing, and a filter change still fetches.
    if (result.screens) {
      // Both defaults, because the server owns them — but only Records comes
      // with data. Charts costs ~800ms to precompute and is not opened every
      // time; see the note on `screens` in 23_api.gs.
      state.filters.analytics = result.screens.filters.analytics;
      state.filters.records = result.screens.filters.records;

      state.records.rows = result.screens.records.rows;
      state.records.offset = result.screens.records.rows.length;
      state.records.hasMore = result.screens.records.hasMore;
      state.records.total = result.screens.records.total;
      state.records.loaded = true;
    }

    state.timing.overview = inlined ? 0 : Date.now() - state.timing.startedAt;
    state.timing.overviewInlined = !!inlined;
    render();
  }

  // The lower half is always fetched. It was briefly inlined too — see
  // `appInlineBoot_`, which has the measurement that took it back out.
  call('appOverview').then(function (r) { applyOverview(r, false); }).catch(fatal);

})();
</script>
