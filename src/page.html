      (record.confirmed ? 'Confirmed. ' : 'Needs review. ') +
      (moved ? 'Transfer. ' : '') + what + ', ' +
      shortDate(record.date) + ', ' + record.account + ', ' + money(record.amount) +
      (record.description ? '. ' + record.description : ''));
    button.addEventListener('click', function () {
      // The tail of a swipe, not a tap. Cleared here rather than on a timer,
      // so the very next genuine tap works.
      if (button.swiped) {
        button.swiped = false;
        return;
      }
      openSheet(record);
    });

    longPressForRule(button, record);
    return swipeToConfirm(button, record);
  }

  /**
   * The rows as consecutive runs of the same day.
   *
   * A run rather than a map keyed by date: the server has already sorted the
   * page newest first, and re-grouping through an object would lose that order
   * on the way through `Object.keys`. This preserves whatever order it was
   * handed and only inserts a boundary where the day changes — which also
   * means a page break mid-day produces two headings, correctly, rather than
   * one heading with a gap in it.
   */
  function groupByDay(rows) {
    var days = [];
    (rows || []).forEach(function (record) {
      var last = days[days.length - 1];
      if (last && last.key === record.date) last.rows.push(record);
      else days.push({ key: record.date, rows: [record] });
    });
    return days;
  }

  /** `2026-08-06` as `6 AUGUST`, or `TODAY` when it is. */
  function dayHeading(key) {
    if (!key) return 'No date';
    if (key === state.data.generatedAt) return 'Today';

    var parts = key.split('-');
    var date = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
    if (isNaN(date.getTime())) return key;

    return date.getDate() + ' ' +
      date.toLocaleDateString(undefined, { month: 'long' }) +
      (date.getFullYear() === new Date().getFullYear() ? '' : ' ' + date.getFullYear());
  }

  /**
   * What a drill narrowed this list to, and the way back out of it.
   *
   * These three filters have no control in the filter bar — they are set by
   * tapping a number on Charts — so without this row they would be state you
   * cannot see, on the screen you go to *to find something*. A search that comes
   * back empty because of a filter set two screens ago reads as the transaction
   * not being there, which is the worst answer this app can give.
   *
   * Clearing the category clears the subcategory with it. A child on its own
   * does not name one group — `(uncategorised)` belongs to every category — and
   * the server would have to guess which parent was meant.
   *
   * `spendOnly` is named `Money out` rather than `Spending`, because the chip
   * says what it is doing to the list rather than which card opened it. The
   * cleared list is a superset, not a different question.
   */
  function drillChips(filters) {
    var category = filters.category && filters.category !== 'All' ? filters.category : '';
    var subcategory =
      filters.subcategory && filters.subcategory !== 'All' ? filters.subcategory : '';
    if (!filters.spendOnly && !category && !subcategory) return null;

    var box = el('div', 'chips drills');
    var chip = function (text, clear) {
      var button = el('button', 'chip on');
      button.type = 'button';
      button.setAttribute('aria-label', 'Remove filter: ' + text);
      add(button, document.createTextNode(text));
      add(button, el('span', 'x', '✕'));
      button.addEventListener('click', function () {
        clear();
        refreshCurrentScreen();
      });
      add(box, button);
    };

    if (filters.spendOnly) {
      chip('Money out', function () { filters.spendOnly = false; });
    }
    if (category) {
      chip(withIcon(categoryIcon(category), category), function () {
        filters.category = 'All';
        filters.subcategory = 'All';
      });
    }
    if (subcategory) {
      chip(withIcon(subcategoryIcon(subcategory), subcategory), function () {
        filters.subcategory = 'All';
      });
    }

    // Only when there is more than one thing to clear. With one chip showing,
    // `Clear all` is a second control doing what the first one already does.
    if (box.childNodes.length > 1) {
      var all = el('button', 'chip', 'Clear all');
      all.type = 'button';
      all.addEventListener('click', function () {
        filters.spendOnly = false;
        filters.category = 'All';
        filters.subcategory = 'All';
        refreshCurrentScreen();
      });
      add(box, all);
    }

    return box;
  }

  function renderRecords(root) {
    add(root, el('h1', null, 'Records'));
    add(root, filterBar('records', { search: true, unconfirmed: true }));

    var drills = drillChips(state.filters.records);
    if (drills) add(root, drills);

    // Holds first, above the dated groups, because that is where they are in
    // time — a pending authorisation is newer than anything settled — and
    // because they are the rows you came to check on.
    var pending = state.records.pending || [];
    if (pending.length) {
      var held = el('div', 'card');
      var head = el('div', 'daygroup');
      add(head, el('div', 'dayhead', 'Pending'));
      pending.forEach(function (record) { add(head, pendingRow(record)); });
      add(held, head);
      add(held, el('p', 'pending-note',
        'Not yet settled, so not counted anywhere'));
      add(root, held);
    }

    var list = el('div', 'card');
    if (!state.records.rows.length) {
      add(list, state.records.loading
        ? spinner()
        : el('p', 'muted', 'Nothing matches those filters.'));
    }
    groupByDay(state.records.rows).forEach(function (day) {
      var group = el('div', 'daygroup');
      add(group, el('div', 'dayhead', dayHeading(day.key)));
      day.rows.forEach(function (record) { add(group, recordRow(record)); });
      add(list, group);
    });
    add(root, list);

    add(root, el('p', 'muted',
      state.records.rows.length + ' of ' + state.records.total));

    if (state.records.hasMore) {
      var more = el('button', 'primary', state.records.loading ? 'Loading…' : 'Load more');
      more.disabled = state.records.loading;
      more.addEventListener('click', loadMoreRecords);
      add(root, more);
    }
  }

  /**
   * A headline number with the shape of it beside it.
   *
   * `onTap` makes the whole card a button, and only the cards that *have* rows
   * behind them get one — a control that does nothing is a promise the card
   * cannot keep, the same rule `categoryBars` follows for a category with no
   * subcategories. The chevron says so before it is tapped.
   */
  function statCard(label, value, thumb, onTap) {
    var card = el('div', 'card');
    var stat = el(onTap ? 'button' : 'div', 'stat');

    var left = el('div', 'grow');
    add(left, el('div', 'label', label));
    add(left, el('div', 'value num', value));
    add(stat, left);
    add(stat, thumb);

    if (onTap) {
      stat.type = 'button';
      stat.className = 'stat tappable';
      stat.setAttribute('aria-label', label + ' ' + value + ', show these transactions');
      add(stat, el('span', 'chev', '›'));
      stat.addEventListener('click', onTap);
    }

    return add(card, stat);
  }

  /** The balance line, small enough that only its direction survives. */
  function sparkline(series) {
    var svg = svgNode('svg', { class: 'thumb', viewBox: '0 0 100 40',
      preserveAspectRatio: 'none' });
    if (!series || series.length < 2) return svg;

    var values = series.map(function (point) { return point.value; });
    var low = Math.min.apply(null, values);
    var span = (Math.max.apply(null, values) - low) || 1;

    add(svg, svgNode('polyline', {
      fill: 'none', class: 'spark', 'vector-effect': 'non-scaling-stroke',
      points: series.map(function (point, i) {
        return ((i / (series.length - 1)) * 100).toFixed(1) + ',' +
          (38 - ((point.value - low) / span) * 36).toFixed(1);
      }).join(' ')
    }));
    return svg;
  }

  /**
   * Spending split by category, as a ring.
   *
   * A radius of 15.915 gives a circumference of almost exactly 100, so a
   * slice's share *is* its `stroke-dasharray` — no arc paths and no
   * trigonometry. Five slices, because a ring 62 pixels wide cannot show more
   * than that as anything but a texture.
   */
  function donut(rows) {
    var svg = svgNode('svg', { class: 'thumb', viewBox: '0 0 42 42' });
    var slices = (rows || []).slice(0, 5);
    var total = slices.reduce(function (sum, row) { return sum + row.total; }, 0);
    if (!total) return svg;

    var offset = 0;
    slices.forEach(function (row) {
      var share = (row.total / total) * 100;
      add(svg, svgNode('circle', {
        cx: 21, cy: 21, r: 15.915, fill: 'none', 'stroke-width': 6,
        stroke: categoryColor(row.name),
        'stroke-dasharray': share.toFixed(2) + ' ' + (100 - share).toFixed(2),
        'stroke-dashoffset': (25 - offset).toFixed(2)
      }));
      offset += share;
    });
    return svg;
  }

  /** In against out, which is the whole of what a cashflow number means. */
  function flowThumb(totals) {
    var svg = svgNode('svg', { class: 'thumb', viewBox: '0 0 100 40' });
    var biggest = Math.max(totals.income, totals.expenses, 1);

    [[totals.income, 5, 'barmark up'], [totals.expenses, 22, 'barmark']]
      .forEach(function (bar) {
        add(svg, svgNode('rect', { x: 0, y: bar[1], height: 13, rx: 3,
          width: Math.max(3, (bar[0] / biggest) * 100).toFixed(1), class: bar[2] }));
      });
    return svg;
  }

  function renderAnalytics(root) {
    add(root, el('h1', null, 'Charts'));
    add(root, filterBar('analytics', {}));

    var data = state.data.analytics;
    if (!data) return add(root, spinner());

    add(root, el('div', 'muted',
      shortDate(data.window.from) + ' — ' + shortDate(data.window.to)));

    // Three answers, biggest first, each with its shape next to it. The full
    // charts are below; these are what you read without scrolling.
    add(root, statCard('Balance', money(data.netWorth.total), sparkline(data.balance)));

    // The one card with a row set behind it. `Balance` is a position rather
    // than a set of transactions, and `Cash flow` is a net of two directions
    // that no single list is the answer to — a drill from either would open
    // rows that do not add up to the number that opened them.
    add(root, statCard('Spending', money(data.totals.expenses), donut(data.byCategory),
      function () { drillToRecords({ spendOnly: true }); }));

    add(root, statCard('Cash flow', money(data.totals.net), flowThumb(data.totals)));

    if (data.totals.unconvertible) {
      add(root, add(el('div', 'card'), el('div', 'muted', data.totals.unconvertible +
        ' row(s) left out — no ' + data.currency + ' amount for them.')));
    }

    add(root, el('h2', null, 'Cashflow'));
    add(root, add(el('div', 'card'), barChart(data.cashflow)));

    add(root, el('h2', null, 'Net worth'));
    add(root, add(el('div', 'card'), lineChart(data.balance)));

    // One list, not two. `bySubcategory` is still sent and still ranks
    // globally, but showing it beside its parent invited the comparison it
    // cannot survive — see `nestedTotals_` for why the two disagree.
    add(root, el('h2', null, 'By category'));
    add(root, add(el('div', 'card'), categoryBars(data.byCategory)));
  }

  /**
   * The filter bar, shared by Records and Charts.
   *
   * Applied on change rather than per keystroke — a request per character
   * typed into the search box is a queue of responses arriving out of order,
   * and the last one to land wins whether or not it is the one you asked for.
   * The search box therefore fires on `change`, which on a phone is when the
   * keyboard is dismissed.
   */
  /**
   * A period spec back to the `id` the server gave it.
   *
   * The two have to agree or the dropdown opens on the wrong entry, so the rule
   * is written once here rather than at each comparison: a named year is
   * `year:2024`, everything else is its kind. `appPeriods_` builds the same
   * string from the other direction.
   */
  function periodId(spec) {
    if (!spec) return 'mtd';
    return spec.kind === 'year' && spec.year ? 'year:' + spec.year : spec.kind;
  }

  /**
   * The account filter, as chips, several at a time.
   *
   * `<select multiple>` is the control this ought to be and is unusable on a
   * phone: iOS draws it as a scroll box with no visible way to add to a
   * selection, so tapping a second account silently replaces the first. Chips
   * show what is on without being opened, which is the only job a filter has.
   *
   * `All` is a chip rather than an absence, because "nothing selected" and
   * "everything selected" look identical otherwise and mean the same thing —
   * `matchesAccount_` treats an empty list as All for exactly that reason.
   * Turning the last account off therefore lands back on All rather than on a
   * blank screen that reads as broken.
   */
  function accountChips(filters, onChange) {
    var chosen = chosenAccounts(filters);

    // A chosen account the `accounts` tab no longer offers still gets a chip,
    // and it is pressed — same rule as the label chips, and the URL is what
    // made it matter here. A bookmark can name an account that has since been
    // renamed, and dropping it would leave the filter *on* with nothing on
    // screen saying so: no chip pressed, All unpressed, and a list of rows that
    // reads as an empty ledger rather than as a filter.
    var names = (state.lists.accounts || []).slice();
    chosen.forEach(function (name) {
      if (names.indexOf(name) === -1) names.push(name);
    });

    // Full width: a wrapping row of chips beside a dropdown at 45% would
    // reflow every time you toggled one.
    var box = el('div', 'fld wide');
    add(box, el('span', 'flabel', 'Account'));

    var chips = el('div', 'chips');
    var draw = function () {
      clear(chips);

      var all = el('button', 'chip', 'All');
      all.type = 'button';
      all.setAttribute('aria-pressed', chosen.length ? 'false' : 'true');
      all.addEventListener('click', function () {
        if (!chosen.length) return;
        chosen = [];
        filters.account = 'All';
        onChange();
      });
      add(chips, all);

      names.forEach(function (name) {
        var on = chosen.indexOf(name) !== -1;
        var chip = el('button', 'chip', name);
        chip.type = 'button';
        chip.setAttribute('aria-pressed', on ? 'true' : 'false');
        chip.addEventListener('click', function () {
          if (on) chosen.splice(chosen.indexOf(name), 1);
          else chosen.push(name);

          // Sorted before it leaves, so picking A then B and B then A are one
          // cached question rather than two — `signature` stringifies this.
          filters.account = chosen.length ? chosen.slice().sort() : 'All';
          onChange();
        });
        add(chips, chip);
      });
    };
    draw();

    add(box, chips);
    return box;
  }

  function filterBar(which, options) {
    var filters = state.filters[which];
    var bar = el('div', 'filters');

    /*
      Matched on `id`, not on `kind`.

      The named years the server now offers are every one of them `kind:
      'year'`, differing only in their `year`. Comparing on kind would mark all
      of them selected at once and, worse, send back `{kind: 'year'}` with no
      year in it — which `resolveWindow_` resolves to the current year, so
      picking 2024 would silently show you 2026.

      The whole entry is kept rather than rebuilt from the option's value, so
      the spec that goes to the server is the one the server described. Only
      `custom` is assembled here, because only its dates live on this side.
    */
    var period = el('select');
    period.setAttribute('aria-label', 'Period');
    state.lists.periods.forEach(function (entry) {
      var option = el('option', null, entry.label);
      option.value = entry.id;
      if (entry.id === periodId(filters.period)) option.selected = true;
      add(period, option);
    });
    period.addEventListener('change', function () {
      var chosen = state.lists.periods.filter(function (entry) {
        return entry.id === period.value;
      })[0] || { kind: 'mtd' };

      filters.period = chosen.kind === 'custom'
        ? { kind: 'custom', from: filters.period.from, to: filters.period.to }
        : { kind: chosen.kind, year: chosen.year };
      refreshCurrentScreen();
    });
    add(bar, labelled('Period', period));

    add(bar, accountChips(filters, function () { refreshCurrentScreen(); }));

    add(bar, pickList('Label', state.lists.labels, filters.label, function (value) {
      filters.label = value;
      refreshCurrentScreen();
    }));

    if (filters.period.kind === 'custom') {
      // The two ends of one range, in one full-width box of their own.
      //
      // Added straight to the bar they were two independent 45% children of a
      // wrapping flex row, so what they paired with depended on how many
      // filters the screen happened to show: on Charts, `From` sat beside
      // `Label` and `To` wrapped onto a line by itself. A range read down a
      // corner is not a range. Grouping them makes the pairing a property of
      // what they are rather than of how many neighbours they have.
      var range = el('div', 'wide range');
      ['from', 'to'].forEach(function (edge) {
        var input = el('input');
        input.type = 'date';
        input.className = 'field';
        input.setAttribute('aria-label', 'Custom ' + edge);
        input.value = filters.period[edge] || '';
        input.addEventListener('change', function () {
          filters.period[edge] = input.value;
          refreshCurrentScreen();
        });
        add(range, labelled(edge === 'from' ? 'From' : 'To', input));
      });
      add(bar, range);
    }

    if (options.search) {
      var search = el('input');
      search.type = 'search';
      search.className = 'field';
      search.placeholder = 'Search';
      search.setAttribute('aria-label', 'Search descriptions');
      search.value = filters.search || '';
      search.addEventListener('change', function () {
        filters.search = search.value;
        refreshCurrentScreen();
      });
      add(bar, labelled('Search', search));
    }

    if (options.unconfirmed) {
      var toggle = el('button', null,
        filters.unconfirmedOnly ? 'Showing: needs review' : 'Showing: everything');
      toggle.addEventListener('click', function () {
        filters.unconfirmedOnly = !filters.unconfirmedOnly;
        refreshCurrentScreen();
      });
      add(bar, toggle);
    }

    return bar;
  }

  /** A `<select>` with `All` on top, which is the default and the common answer. */
  /** A control with its name above it. */
  function labelled(text, control) {
    var field = el('div', 'fld');
    add(field, el('span', 'flabel', text));
    add(field, control);
    return field;
  }

  function pickList(label, values, chosen, onChange) {
    var select = el('select');
    select.setAttribute('aria-label', label);

    ['All'].concat(values).forEach(function (value) {
      var option = el('option', null, value);
      option.value = value;
      if (value === chosen) option.selected = true;
      add(select, option);
    });
    select.addEventListener('change', function () { onChange(select.value); });
    return labelled(label, select);
  }

  // -------------------------------------------------------------------------
  // Acting on a row
  // -------------------------------------------------------------------------

  /**
   * The row's labels, as a set of chips you tick.
   *
   * **Chips over a text field, and the reason is a matching rule rather than a
   * taste.** `matchesFilters_` tests a label against the *parts* of the column
   * — `splitLabels_` on commas, then an exact comparison — so `travel` does not
   * match `business-travel`, deliberately, because the alternative is a filter
   * that quietly over-matches. A free text field invites exactly the near-miss
   * that rule refuses to forgive, and it fails invisibly: the label looks right
   * on the transaction and the transaction is missing from the report.
   *
   * The offered set is `labels`, the tab that is the known set. A label already
   * on the row but no longer on that tab is offered too, and ticked — dropping
   * it silently would mean opening a transaction and saving it was a way to
   * lose data you never looked at.
   */
  function labelChips(record) {
    // Deduplicated on the way in. `labelNames_` maps the `labels` tab row for
    // row and nothing stops that tab holding the same word twice — which draws
    // two chips that toggle independently and disagree about one label.
    var current = (record.labels || []).map(String);
    var offered = [];
    (state.lists.labels || []).map(String).concat(current).forEach(function (name) {
      if (name && offered.indexOf(name) === -1) offered.push(name);
    });

    var box = el('div');
    add(box, el('label', null, 'Labels'));

    if (!offered.length) {
      add(box, el('p', 'muted', 'No labels yet. Add rows to the labels tab.'));
      // Still answers, and answers with what is on the row — so a sheet with
      // no chips on it cannot be the thing that clears a label.
      return { node: box, chosen: function () { return current.slice(); } };
    }

    var picked = {};
    current.forEach(function (name) { picked[name] = true; });

    var chips = el('div', 'chips');
    offered.forEach(function (name) {
      var chip = el('button', 'chip', name);
      chip.type = 'button';
      chip.setAttribute('aria-pressed', picked[name] ? 'true' : 'false');
      chip.addEventListener('click', function () {
        picked[name] = !picked[name];
        chip.setAttribute('aria-pressed', picked[name] ? 'true' : 'false');
      });
      add(chips, chip);
    });
    add(box, chips);

    return {
      node: box,
      // Read in `offered` order rather than click order, so saving a row twice
      // without touching anything writes the same string both times.
      chosen: function () {
        return offered.filter(function (name) { return picked[name]; });
      }
    };
  }

  /**
   * Which of the three kinds this row is, as the sheet would answer.
   *
   * `type` is a formula over the category and is the authority whenever it has
   * an answer. The sign is the fallback and only the fallback: a row nothing
   * has categorised yet has no `type` at all, and money out of an account is
   * spending until something says otherwise.
   */
  function kindOfRecord(record) {
    if (record.type === TRANSFER) return TRANSFER;
    if (record.type === 'income' || record.type === 'expense') return record.type;
    return record.amount > 0 ? 'income' : 'expense';
  }

  /**
   * Expense · Income · Transfer, across the top of the sheet.
   *
   * **This replaces a toggle at the bottom, and the difference is not
   * cosmetic.** Marking a transfer used to be a link under the Confirm button,
   * below the pickers — so the sheet asked "which category?" first and "is this
   * even a category question?" last, in that order, every time. It also meant
   * the one control that changes what the *rest* of the sheet should be asking
   * sat below all of it.
   *
   * A transfer is not a category with an awkward UI. It is one of the three
   * things a row can be, `type` says which, and every total in the book already
   * turns on it. Naming that first and letting the body follow is the shape the
   * data has had all along.
   *
   * Buttons rather than a real `<select>`: three options, always visible, and
   * on iOS a select opens a wheel picker — which is the thing this sheet had to
   * be redesigned once already to stop doing on open.
   */
  function typeTabs(current, onChange) {
    var box = el('div', 'segmented');
    box.setAttribute('role', 'group');
    box.setAttribute('aria-label', 'What kind of transaction this is');

    [['expense', 'Expense'], ['income', 'Income'], [TRANSFER, 'Transfer']]
      .forEach(function (pair) {
        var tab = el('button', 'seg', pair[1]);
        tab.type = 'button';
        tab.setAttribute('aria-pressed', pair[0] === current ? 'true' : 'false');
        tab.addEventListener('click', function () {
          if (pair[0] === current) return;
          onChange(pair[0]);
        });
        add(box, tab);
      });

    return box;
  }

  /**
   * The whole taxonomy in one `<select>`, parents as `<optgroup>`.
   *
   * There were two selects — "change the subcategory" and "or set only the
   * category" — and the word doing the work in that pair was *or*. Two controls
   * for one decision, where picking in the second undoes the meaning of the
   * first, and neither label says which wins. `<optgroup>` is the element for
   * exactly this: the parent is a heading you cannot select by accident, the
   * children under it are the choices, and both render natively in the wheel
   * picker on a phone.
   *
   * Setting only the parent is still reachable, as the first entry inside each
   * group. It is a real answer — "this is Shopping and I do not know what kind"
   * — and losing it to the tidier structure would have been a downgrade.
   *
   * **A child sends its parent with it**, which the two-select version did not
   * and got away with: `categoryFormula` resolves a lone `subcategory_override`
   * through a VLOOKUP, so the parent was implied correctly. It stops being
   * implied the moment the row already carries a `category_override` — every
   * row marked as a transfer does — because that column is checked *first* and
   * would go on winning. Sending both is what lets this sheet move a row out of
   * Transfer at all.
   */
  function categoryPicker(record, kind, firstLabel) {
    var lists = state.lists.categories;
    var box = el('div');

    var select = el('select');
    select.className = 'field';

    var leave = el('option', null, firstLabel);
    leave.value = '';
    add(select, leave);

    var parentOf = {};
    (lists.children || []).forEach(function (entry) { parentOf[entry.name] = entry.parent; });

    (lists.parents || []).forEach(function (parent) {
      // A blank `kind` is a category the user added without saying which half
      // it belongs to. Hiding it would make it unreachable from the app, so it
      // is offered on both.
      if (parent.kind && parent.kind !== kind) return;

      var group = el('optgroup');
      group.label = withIcon(parent.icon, parent.name);

      var whole = el('option', null, 'Anything in ' + parent.name);
      whole.value = 'p:' + parent.name;
      if (record.category === parent.name && !record.subcategory) whole.selected = true;
      add(group, whole);

      (lists.children || []).forEach(function (child) {
        if (child.parent !== parent.name) return;
        var option = el('option', null, withIcon(child.icon, child.name));
        option.value = 'c:' + child.name;
        if (child.name === record.subcategory && child.parent === record.category) {
          option.selected = true;
        }
        add(group, option);
      });

      add(select, group);
    });

    add(box, select);

    return {
      node: box,
      /** Whether anything but the first entry is selected. */
      answered: function () { return select.selectedIndex > 0 && !!select.value; },
      chosen: function () {
        var value = select.value;
        if (!value) return {};
        if (value.indexOf('p:') === 0) return { category_override: value.slice(2) };

        var child = value.slice(2);
        return { subcategory_override: child, category_override: parentOf[child] || '' };
      }
    };
  }

  /**
   * Where the money went, when the answer is Transfer.
   *
   * **Naming the destination is what makes the arithmetic right**, and without
   * it this book was quietly wrong about a common case. A cash withdrawal is
   * one row: the bank debits €100 and nothing credits your wallet, because a
   * wallet has no API. Marking it a transfer kept it out of spending —
   * correctly — and left net worth €100 short of the money in your pocket.
   * Picking the wallet writes the leg the bank never will.
   *
   * **Every account is offered, and the server does two different things with
   * them.** The list started as cash and asset only, on the reasoning below
   * about not inventing a leg a bank will report itself — which is right about
   * the leg and was wrong about the list, because it left no way to say "this
   * €500 went to my other current account". That is the commonest internal
   * move there is.
   *
   *   **Cash or asset** — the leg is *written*, because nothing will ever
   *   report it. A wallet has no API.
   *
   *   **A bank** — the leg is *found*. The credit is already in the book, or
   *   arrives with the next sync, so the two rows are paired and both marked.
   *   Writing one would be a second copy of money that moved once, which is
   *   the original argument and is still true.
   *
   * The page does not need to know which is which, and deliberately does not
   * ask: `appMarkTransfer` decides from the account's `kind` and says in the
   * toast what it did.
   *
   * **"Somewhere else" is a real answer and not a cop-out.** Money to another
   * bank you do not sync, or to a person, has no account here to credit. It is
   * still not spending, so it is still a transfer — and net worth does fall,
   * correctly, because net worth is the sum of what you track and it has left.
   */
  function destinationPicker(record) {
    var box = el('div');
    add(box, el('label', null, 'Where did it go?'));

    var where = el('select');
    where.className = 'field';

    var elsewhere = el('option', null, 'Somewhere outside Spendsheet');
    elsewhere.value = TRANSFER_OUTSIDE;
    add(where, elsewhere);

    // `lists.accounts` is every active account, which is what the server now
    // accepts. Its own is left out for the obvious reason, and because the
    // server refuses it anyway.
    (state.lists.accounts || []).forEach(function (name) {
      if (name === record.account) return;
      var option = el('option', null, name);
      option.value = name;
      add(where, option);
    });
    add(box, where);

    add(box, el('div', 'muted',
      'Both balances move. A cash or asset account gets the other half ' +
      'written for it; a bank is matched against the row it already reported, ' +
      'or as soon as it does.'));

    return { node: box, value: function () { return where.value; } };
  }

  /**
   * How long a press has to be before it means "rule", not "open".
   *
   * 500ms is the platform convention for a long press on both iOS and Android,
   * so it is the one people already have in their hands.
   */
  var LONG_PRESS_MS = 500;

  /**
   * Long-press a row to turn it into a categorisation rule.
   *
   * The gesture exists because the alternative is unusable in practice: you see
   * the same merchant miscategorised for the fourth time, and the only way to
   * fix it *permanently* is to open the spreadsheet on a laptop and type a row
   * on the `rules` tab. Correcting the transaction in front of you does not do
   * it — that is an override on one row, and `_memory` is rebuilt from confirmed
   * rows rather than being a rule.
   *
   * Cancelled by any movement at all, not by a threshold: a press that has
   * begun to travel is a scroll or a swipe, and firing a modal into the middle
   * of either is the worst outcome available. `contextmenu` is suppressed for
   * the same reason iOS shows one — a long press on a `<button>` is a text
   * selection gesture there, and the callout would open behind the sheet.
   */
  function longPressForRule(button, record) {
    var timer = null;

    var cancel = function () {
      if (timer === null) return;
      clearTimeout(timer);
      timer = null;
    };

    button.addEventListener('touchstart', function () {
      cancel();
      timer = setTimeout(function () {
        timer = null;
        // The press has been claimed, so the `click` that follows the release
        // must not also open the detail sheet on top of the rule sheet.
        button.swiped = true;
        openRuleSheet(record);
      }, LONG_PRESS_MS);
    }, { passive: true });

    ['touchmove', 'touchend', 'touchcancel'].forEach(function (name) {
      button.addEventListener(name, cancel, { passive: true });
    });

    // Without this, iOS opens its own selection callout mid-press.
    button.addEventListener('contextmenu', function (event) { event.preventDefault(); });
  }

  /**
   * The rule sheet: prefilled from the row, and every field still editable.
   *
   * Prefilled because the whole value of the gesture is not having to think,
   * and editable because the prefill is a guess about which part of a bank's
   * description identifies the merchant. `merchantKey` is a good guess — it is
   * `normalizeMerchant`, the same function the cascade keys on — but a bank
   * that writes `PAYPAL *STEAM` defeats any general answer, and the fix is one
   * field the person can widen or narrow rather than a cleverer normaliser.
   */
  function openRuleSheet(record) {
    var dialog = document.getElementById('sheet') || el('dialog');
    dialog.id = 'sheet';
    clear(dialog);
    if (!dialog.isConnected) document.body.appendChild(dialog);

    var close = el('button', 'sheet-close', '\u{2715}');
    close.type = 'button';
    close.autofocus = true;
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', function () { dialog.close(); });
    add(dialog, close);

    var body = el('div', 'sheet-body');
    add(dialog, body);

    add(body, el('h2', null, 'Always categorise this'));
    add(body, el('p', 'muted', record.description || '(no description)'));

    add(body, el('label', null, 'When the description contains'));
    var pattern = el('input');
    pattern.type = 'text';
    pattern.className = 'field';
    pattern.value = record.merchantKey || record.description || '';
    add(body, pattern);

    add(body, el('label', null, 'Match'));
    var how = el('select');
    how.className = 'field';
    [['contains', 'contains it'], ['equals', 'is exactly it'],
     ['starts_with', 'starts with it'], ['regex', 'matches it as a pattern']]
      .forEach(function (pair) {
        var option = el('option', null, pair[1]);
        option.value = pair[0];
        add(how, option);
      });
    add(body, how);

    add(body, el('label', null, 'File it under'));
    var child = el('select');
    child.className = 'field';
    state.lists.categories.children.forEach(function (entry) {
      var option = el('option', null,
        withIcon(entry.icon, entry.name) + '  —  ' + entry.parent);
      option.value = entry.name;
      option.dataset.parent = entry.parent;
      if (entry.name === record.subcategory && entry.parent === record.category) {
        option.selected = true;
      }
      add(child, option);
    });
    add(body, child);

    var save = el('button', 'primary', 'Save rule');
    save.type = 'button';
    save.style.marginTop = '16px';
    save.addEventListener('click', function () {
      var chosen = child.options[child.selectedIndex];
      save.disabled = true;
      save.textContent = 'Saving\u{2026}';

      call('appAddRule', {
        field: 'description',
        match_type: how.value,
        pattern: pattern.value,
        category: chosen ? chosen.dataset.parent : '',
        subcategory: child.value
      }).then(function (result) {
        dialog.close();
        toast(result.message);
      }).catch(function (error) {
        // Kept open on a refusal: every one of them names something on this
        // sheet that can be corrected, and closing would lose what was typed.
        save.disabled = false;
        save.textContent = 'Save rule';
        toast(error.message);
      });
    });
    add(body, save);

    dialog.onclick = function (event) {
      if (event.target === dialog) dialog.close();
    };
    dialog.showModal();
  }

  /**
   * The confirm/categorise sheet, from the bottom.
   *
   * **It asks what the row *is* before it asks what to file it under**, because
   * those are different questions and only the first one changes the second.
   * The tabs across the top are `type` — the column every total in this book
   * already turns on — and the body below them is whatever that answer makes
   * relevant: two of the three want a category, the third wants a destination.
   *
   * The previous arrangement asked them in the opposite order and in different
   * registers: two category pickers, a Confirm, and then, underneath all of it,
   * a link offering to reinterpret the whole thing as a transfer. Everything
   * below the fold was the control that should have come first.
   *
   * Optimistic: the row is redrawn as confirmed before the server answers, and
   * put back if it refuses. On a phone that is the difference between a list
   * that responds and one you wait for.
   */
  function openSheet(record) {
    var dialog = document.getElementById('sheet') || el('dialog');
    dialog.id = 'sheet';
    clear(dialog);
    if (!dialog.isConnected) document.body.appendChild(dialog);

    // The close button, first, and both of those words are load-bearing.
    //
    // It replaces a "Cancel" link that was at the *bottom*, under two pickers
    // and a Confirm — the furthest point in the sheet from a thumb, for the
    // one action you take when you opened it by mistake.
    //
    // First in the markup because `showModal` focuses the first focusable
    // descendant. That used to be the subcategory `<select>`, and iOS opens a
    // select's wheel picker on focus — so tapping a transaction opened the
    // sheet *and* the category picker on top of it, every time. Nothing here
    // asked for focus; taking it deliberately is the only way to stop it
    // landing somewhere that acts on being focused.
    var close = el('button', 'sheet-close', '\u{2715}');
    close.type = 'button';
    close.autofocus = true;
    close.setAttribute('aria-label', 'Close');
    close.addEventListener('click', function () { dialog.close(); });
    add(dialog, close);

    // Everything else goes inside a wrapper, which is what makes the
    // backdrop test below honest: with the content directly on the dialog,
    // `event.target === dialog` also fires on the dialog's own 16px of
    // padding, so a near-miss tap inside the sheet would close it.
    var body = el('div', 'sheet-body');
    add(dialog, body);

    add(body, el('h2', null, record.description || '(no description)'));
    add(body, el('p', 'muted', shortDate(record.date) + ' \u{00b7} ' + record.account +
      ' \u{00b7} ' + money(record.amount)));

    /**
     * The description, when it is yours to change.
     *
     * Above the tabs because it is a fact about the row rather than about which
     * of the three kinds it is — a cash entry you mistyped and a transfer leg
     * this project named for you both want renaming, and they open on different
     * tabs. Both buttons send it for the same reason.
     *
     * **Offered only when the server says so.** A synced row's description is
     * part of what identifies it — `computeUid` hashes it when the bank sends
     * no `entry_reference` — so rewriting one can stop a later sync recognising
     * a transaction already in the book. The page does not work that out; it
     * reads `editableDescription`, and the server asks the same question again
     * before writing, because a page can send anything.
     *
     * The heading above still shows the original. That is deliberate: it is
     * what the row is called *now*, and having it beside the field is what
     * makes an edit look like an edit rather than like a form you must fill in.
     */
    var rename = null;
    if (record.editableDescription) {
      add(body, el('label', null, 'Description'));
      rename = el('input');
      rename.type = 'text';
      rename.className = 'field';
      rename.value = record.description || '';
      add(body, rename);
    }

    /** What to send, or nothing at all when it was not touched. */
    var renamedTo = function () {
      if (!rename) return null;
      var typed = rename.value.trim();
      if (!typed || typed === (record.description || '')) return null;
      return typed;
    };

    // What the row is now, and what you are proposing it should be. They start
    // equal and the tabs move the second one only.
    var was = kindOfRecord(record);
    var kind = was;

    var tabs = el('div');
    var pane = el('div');
    add(body, tabs, pane);

    var drawTabs = function () {
      clear(tabs);
      add(tabs, typeTabs(kind, function (picked) {
        kind = picked;
        drawTabs();
        drawPane();
      }));
    };

    var drawPane = function () {
      clear(pane);
      if (kind === TRANSFER) return drawTransfer();
      drawCategory();
    };

    /**
     * The two kinds that want a category.
     *
     * `firstLabel` carries the one piece of state that matters here: whether
     * leaving the picker alone is a legitimate answer. It is, when the row is
     * already this kind and you opened the sheet to confirm the guess. It is
     * not, when you have just moved the row *out* of Transfer — because the
     * `category_override` saying Transfer is still on the row and still wins,
     * so "leave as it is" would close the sheet having changed nothing while
     * the tab said otherwise.
     */
    var drawCategory = function () {
      var moving = was === TRANSFER;

      add(pane, el('p', 'muted', record.category
        ? 'Currently ' + withIcon(categoryIcon(record.category), record.category) +
          (record.subcategory
            ? ' \u{203a} ' + withIcon(subcategoryIcon(record.subcategory), record.subcategory)
            : '') +
          (record.source ? ' (' + record.source + ')' : '')
        : 'Not categorised.'));

      var picker = categoryPicker(record, kind,
        moving ? 'Pick a category\u{2026}' : 'Leave as it is');
      add(pane, picker.node);

      var labels = labelChips(record);
      add(pane, labels.node);

      var confirm = el('button', 'primary', record.confirmed ? 'Save' : 'Confirm');
      confirm.style.marginTop = '16px';
      confirm.type = 'button';
      confirm.addEventListener('click', function () {
        if (moving && !picker.answered()) {
          return toast('Pick the category it should be instead.');
        }

        var decision = picker.chosen();
        decision.uid = record.uid;
        decision.confirmed = true;
        // Always sent, because the chips always show the row's current value —
        // so "what is ticked" is the answer whether or not you touched them,
        // and an untouched set writes back what was already there. See the note
        // on `labels` in `applyReviewDecisions_` for why that is safe.
        decision.labels = labels.chosen();
        // Absent unless it actually changed — `applyReviewDecisions_` writes
        // whatever it is given, and re-sending the same string would report a
        // rename on every confirm.
        var renamed = renamedTo();
        if (renamed) decision.description = renamed;

        dialog.close();
        sendDecision(record, decision);
      });
      add(pane, confirm);
    };

    /**
     * The third kind, which wants a destination rather than a category.
     *
     * One button, whatever the row was. `webAppLinkTransfer_` writes the
     * category *and* the counter-leg in one call and is idempotent per
     * destination — the leg's uid is derived from this row's — so pressing it
     * on a row that is already a transfer records the other side it never had,
     * rather than a second copy of it.
     */
    var drawTransfer = function () {
      add(pane, el('p', 'muted',
        'Money between accounts you own. Not income, not spending, and counted ' +
        'in neither.'));

      var where = destinationPicker(record);
      add(pane, where.node);

      var labels = labelChips(record);
      add(pane, labels.node);

      var mark = el('button', 'primary',
        was === TRANSFER ? 'Save' : 'Mark as a transfer');
      mark.style.marginTop = '16px';
      mark.type = 'button';
      mark.addEventListener('click', function () {
        var destination = where.value();
        var chosenLabels = labels.chosen();
        var renamed = renamedTo();
        dialog.close();

        // Optimistic on the row itself, the way `sendDecision` is: the category
        // is what makes it a transfer, and the row redraws neutral at once.
        var before = { category: record.category, subcategory: record.subcategory,
          type: record.type, inReports: record.inReports,
          confirmed: record.confirmed, labels: record.labels };

        record.category = TRANSFER_CATEGORY;
        record.type = TRANSFER;
        record.inReports = false;
        record.confirmed = true;
        record.labels = chosenLabels.slice();
        render();

        var request = { uid: record.uid, destination: destination,
          labels: chosenLabels };
        if (renamed) request.description = renamed;

        call('appMarkTransfer', request)
          .then(function (result) {
            toast(result.message);
            reloadAfterWrite();
          }).catch(function (error) {
            record.category = before.category;
            record.subcategory = before.subcategory;
            record.type = before.type;
            record.inReports = before.inReports;
            record.confirmed = before.confirmed;
            record.labels = before.labels;
            toast(error.message);
            render();
          });
      });
      add(pane, mark);
    };

    drawTabs();
    drawPane();

    // Tap outside to dismiss. `<dialog>` does not do this for you — it gives
    // you Escape, which a phone has no key for. The test is only sound because
    // everything visible is inside `.sheet-body`; see the note there.
    //
    // Rebound on every open rather than once, because `clear()` empties the
    // dialog but the element itself is reused, so a listener added here would
    // otherwise accumulate one copy per transaction you ever tapped.
    dialog.onclick = function (event) {
      if (event.target === dialog) dialog.close();
    };

    dialog.showModal();
  }

  /**
   * A row that has just been confirmed no longer matches "needs review".
   *
   * Removed locally rather than by refetching, so the list does not jump back
   * to its first page — see `reloadAfterWrite`. Returns where it was, because
   * a refusal has to put it back exactly there: appending it would silently
   * re-sort someone's list under them, and dropping it for good would hide a
   * transaction that is still unconfirmed on the server.
   */
  function dropIfFiltered(record) {
    if (!state.filters.records.unconfirmedOnly) return -1;

    var at = state.records.rows.indexOf(record);
    if (at === -1) return -1;

    state.records.rows.splice(at, 1);
    if (state.records.total > 0) state.records.total--;
    return at;
  }

  function restoreDropped(record, at) {
    if (at < 0) return;
    state.records.rows.splice(at, 0, record);
    state.records.total++;
  }

  /**
   * A category's kind, from the list the bootstrap already sends.
   *
   * Only used to predict what the sheet is about to derive, so the row can be
   * redrawn before the server answers. `typeFormula()` is the authority and
   * this is a guess at what it will say — which is why `reloadAfterWrite`
   * follows every write and replaces the guess with the answer.
   */
  function kindOfCategory(name) {
    var found = (state.lists.categories.parents || []).filter(function (entry) {
      return entry.name === name;
    })[0];
    return found ? found.kind : '';
  }

  function sendDecision(record, decision) {
    // Optimistic, and the local copies are what get redrawn — the server's own
    // view is refetched afterwards rather than assumed.
    var was = { confirmed: record.confirmed, category: record.category,
      subcategory: record.subcategory, labels: record.labels, type: record.type,
      inReports: record.inReports };

    record.confirmed = true;
    if (decision.subcategory_override) record.subcategory = decision.subcategory_override;
    if (decision.category_override) {
      record.category = decision.category_override;
      // `type` is derived from the category on the sheet, so predicting it here
      // is what makes marking a transfer redraw as one immediately rather than
      // a round trip later. `in_reports` follows it, which is what stops a row
      // you just excluded from still colouring itself as spending.
      var kind = kindOfCategory(decision.category_override);
      if (kind) {
        record.type = kind;
        record.inReports = kind !== TRANSFER;
      }
    }
    if (decision.labels !== undefined) record.labels = decision.labels.slice();
    var droppedAt = dropIfFiltered(record);
    render();

    // Both failure paths put the row back the way it was, and the soft one
    // used to forget to redraw — so a refusal left the optimistic row on
    // screen looking saved until something else happened to call `render`.
    var refuse = function (message) {
      toast(message);
      record.confirmed = was.confirmed;
      record.category = was.category;
      record.subcategory = was.subcategory;
      record.labels = was.labels;
      record.type = was.type;
      record.inReports = was.inReports;
      restoreDropped(record, droppedAt);
      render();
    };

    call('appConfirm', [decision]).then(function (result) {
      var outcome = (result.results || [])[0];
      if (outcome && !outcome.ok) return refuse('Not saved: ' + outcome.reason);

      toast('Saved.');
      // The derived columns are formulas, so what a confirmation *means* is
      // only knowable by asking the sheet again.
      reloadAfterWrite();
    }).catch(function (error) { refuse(error.message); });
  }

  // -------------------------------------------------------------------------
  // Add
  // -------------------------------------------------------------------------

  /**
   * A cash transaction.
   *
   * Type the amount without a sign — a bare number is spending, and an Income
   * or Transfer category flips it. That rule lives in `cashEntryAmount` on the
   * server and this form does not reimplement it; the hint is here because the
   * form is where you would otherwise wonder.
   */
  function renderAdd(root) {
    // No tab reaches this screen any more, so it owes you the way back that a
    // tab bar used to be.
    var back = el('button', 'link', '\u{2190} Home');
    back.type = 'button';
    back.addEventListener('click', function () { go('dashboard'); });
    add(root, back);

    add(root, el('h1', null, 'Add cash'));

    if (!state.lists.cashAccounts.length) {
      return add(root, add(el('div', 'card'),
        el('p', 'muted', 'No cash accounts yet. Add a row to the accounts tab with ' +
          'kind set to cash, then reload.')));
    }

    var form = el('div', 'card');

    add(form, el('label', null, 'Amount'));
    var amount = el('input');
    amount.type = 'text';
    // `inputmode` rather than `type=number`: a decimal-comma keyboard produces
    // `3,50`, which a number input silently discards rather than rejecting.
    amount.inputMode = 'decimal';
    amount.className = 'field';
    amount.placeholder = '3.50';
    add(form, amount);
    add(form, el('div', 'muted',
      'No sign. A bare number is spending; an Income or Transfer category flips it.'));

    add(form, el('label', null, 'Account'));
    var account = el('select');
    account.className = 'field';
    state.lists.cashAccounts.forEach(function (name) {
      var option = el('option', null, name);
      option.value = name;
      // Arriving from a tile already answers this question, so the form does
      // not ask it again — it shows the answer, still changeable.
      if (name === state.addAccount) option.selected = true;
      add(account, option);
    });
    add(form, account);

    add(form, el('label', null, 'Subcategory'));
    var category = el('select');
    category.className = 'field';
    add(category, el('option', null, 'Uncategorised'));
    state.lists.categories.children.forEach(function (entry) {
      var option = el('option', null,
        (entry.icon ? entry.icon + '  ' : '') + entry.name + '  —  ' + entry.parent);
      option.value = entry.name;
      option.dataset.parent = entry.parent;
      add(category, option);
    });
    add(form, category);

    add(form, el('label', null, 'Date'));
    var date = el('input');
    date.type = 'date';
    date.className = 'field';
    date.value = state.data.generatedAt || '';
    add(form, date);

    add(form, el('label', null, 'Note'));
    var note = el('input');
    note.type = 'text';
    note.className = 'field';
    add(form, note);

    var submit = el('button', 'primary', 'Add');
    submit.style.marginTop = '16px';
    submit.addEventListener('click', function () {
      var chosen = category.options[category.selectedIndex];
      submit.disabled = true;
      submit.textContent = 'Adding…';

      call('appAddCash', {
        amount: amount.value.replace(',', '.'),
        account: account.value,
        subcategory: category.selectedIndex > 0 ? category.value : '',
        category: category.selectedIndex > 0 ? chosen.dataset.parent : '',
        date: date.value,
        note: note.value
      }).then(function (result) {
        // `inserted` is not necessarily *your* row: the drain takes every
        // complete unprocessed one, including a half-typed entry sitting on
        // the Sheets tab. So the message says how many landed, not "added".
        toast(result.message);
        amount.value = '';
        note.value = '';
        submit.disabled = false;
        submit.textContent = 'Add';
        // A brand-new transaction, so Records genuinely does not have it —
        // unlike a confirmation, which only changes a row already on screen.
        // `invalidate` marks it and `go()` fetches it when you next open it.
        reloadAfterWrite();
      }).catch(function (error) {
        toast(error.message);
        submit.disabled = false;
        submit.textContent = 'Add';
      });
    });
    add(form, submit);
    add(root, form);
  }

  /**
   * Set an asset account's value, by stating the total rather than the change.
   *
   * You read 14,500 off a broker's app; you did not compute the €1,500 it moved
   * by, and being asked for that number is being asked to do arithmetic the
   * screen already has both operands for. So this asks for the new total and
   * writes the **difference** as one transaction.
   *
   * Writing a difference rather than overwriting a cell is the whole point.
   * `balanceSeries_` reconstructs the net-worth curve by walking transactions
   * backwards from today, so a value that only ever changed by being overwritten
   * was invisible to it — the curve was flat and then, on the day you retyped
   * the number, the *whole* line moved. A dated transaction puts the change
   * where it happened.
   *
   * It goes in as `Transfer › Valuation change`, so `in_reports` keeps it out of
   * every spending and income total while `accountBalanceFormula`'s SUMIF and
   * the balance curve both still see it. A market gain is not income.
   *
   * The sign needs no special case, which is worth checking against
   * `cashEntryAmount` rather than trusting: a positive delta with a `transfer`
   * category stays positive, and a negative one wins as typed. The raw signed
   * difference is exactly the right thing to send.
   */
  function renderSetValue(root) {
    var back = el('button', 'link', '\u{2190} Home');
    back.type = 'button';
    back.addEventListener('click', function () { go('dashboard'); });
    add(root, back);

    add(root, el('h1', null, 'Update balance'));

    var accounts = state.lists.assetAccounts || [];
    if (!accounts.length) {
      return add(root, add(el('div', 'card'),
        el('p', 'muted', 'No asset accounts yet. Add a row to the accounts tab ' +
          'with kind set to asset, then reload.')));
    }

    var form = el('div', 'card');

    add(form, el('label', null, 'Account'));
    var account = el('select');
    account.className = 'field';
    accounts.forEach(function (entry) {
      var option = el('option', null, entry.name);
      option.value = entry.name;
      if (entry.name === state.addAccount) option.selected = true;
      add(account, option);
    });
    add(form, account);

    var current = el('div', 'muted');
    add(form, current);

    add(form, el('label', null, 'New value'));
    var value = el('input');
    value.type = 'text';
    // `inputmode` rather than `type=number`, for the reason `renderAdd` gives:
    // a decimal-comma keyboard produces `14500,50`, which a number input
    // discards silently rather than rejecting.
    value.inputMode = 'decimal';
    value.className = 'field';
    add(form, value);

    // Tapping the field selects what is in it, because the field arrives
    // pre-filled — see `prefill`. Without this, correcting 12,700 to 14,500 on a
    // phone is eight taps of backspace before the first digit of the new number.
    value.addEventListener('focus', function () { value.select(); });

    var preview = el('div', 'muted');
    add(form, preview);

    add(form, el('label', null, 'Note'));
    var note = el('input');
    note.type = 'text';
    note.className = 'field';
    note.placeholder = 'Optional';
    add(form, note);

    var submit = el('button', 'primary', 'Record the change');
    submit.type = 'button';
    submit.style.marginTop = '16px';

    /** What is on the account now, and what pressing the button would write. */
    var chosen = function () {
      return assetAccount(account.value) || { balance: null };
    };

    /** Whether the field still holds what `prefill` put there. */
    var pristine = true;

    var describe = function () {
      var was = chosen().balance;
      current.textContent = was === null
        ? 'No value recorded yet.'
        : 'Currently ' + money(was);

      var typed = Number(String(value.value).replace(',', '.'));
      if (!value.value || !isFinite(typed)) {
        preview.textContent = '';
        submit.disabled = false;
        return;
      }

      var delta = typed - (was || 0);
      // `toFixed(2)` before the comparison, because the subtraction is floating
      // point: 14500 - 12700.1 leaves a value that is not zero and not worth a
      // transaction either.
      var rounded = Number(delta.toFixed(2));

      if (rounded === 0) {
        // Two different situations reach zero and only one of them is a
        // correction. Arriving on a pre-filled field and typing the same number
        // back are indistinguishable by value, so `pristine` tells them apart —
        // otherwise the screen greets you by saying you got it wrong.
        preview.textContent = pristine
          ? 'Edit this to the value it holds now.'
          : 'That is what it already says — nothing to record.';
        submit.disabled = true;
        return;
      }

      submit.disabled = false;
      preview.textContent = (rounded > 0 ? 'Up ' : 'Down ') + money(Math.abs(rounded)) +
        ' — recorded as one transaction dated today.';
    };

    /**
     * Start from the number that is already there.
     *
     * An empty field asks you to type the whole total when the change is usually
     * a few digits at the end of it — and worse, it asks you to type it from
     * memory or from the line just above, which is the transcription error this
     * screen exists to avoid. Editing 12,700.00 into 14,500.00 is one gesture.
     *
     * A plain `toFixed(2)` and not `money()`: this value is read straight back
     * by `Number(String(...).replace(',', '.'))`, so a currency symbol or a
     * thousands separator would come back `NaN`. It is written with a dot even
     * in a decimal-comma locale because that parser takes either, and a dot is
     * the one of the two that cannot be mistaken for a group separator.
     *
     * Called on render and on every account change, never from `describe` —
     * `describe` runs on `input`, and prefilling from there would overwrite each
     * keystroke as it was typed.
     */
    var prefill = function () {
      var was = chosen().balance;
      value.value = was === null ? '' : was.toFixed(2);
      pristine = true;
    };

    account.addEventListener('change', function () { prefill(); describe(); });
    value.addEventListener('input', function () { pristine = false; describe(); });
    prefill();
    describe();

    submit.addEventListener('click', function () {
      var was = chosen().balance;
      var typed = Number(String(value.value).replace(',', '.'));
      if (!value.value || !isFinite(typed)) return toast('Type the new value.');

      var delta = Number((typed - (was || 0)).toFixed(2));
      if (delta === 0) return toast('That is what it already says.');

      submit.disabled = true;
      submit.textContent = 'Recording\u{2026}';

      call('appAddCash', {
        amount: delta,
        account: account.value,
        category: TRANSFER_CATEGORY,
        subcategory: VALUATION_SUBCATEGORY,
        date: state.data.generatedAt || '',
        note: note.value || (account.value + ' revalued to ' + money(typed))
      }).then(function (result) {
        toast(result.message);
        value.value = '';
        note.value = '';
        submit.disabled = false;
        submit.textContent = 'Record the change';
        reloadAfterWrite();
        // The tile's balance came with `appOpen` and has just moved, so the
        // screen would otherwise keep offering the old number as "currently".
        // `loadDashboard` refetches it; this redraws once it lands.
        go('dashboard');
      }).catch(function (error) {
        toast(error.message);
        submit.disabled = false;
        submit.textContent = 'Record the change';
      });
    });

    add(form, submit);
    add(root, form);
  }

  // -------------------------------------------------------------------------
  // Pull to refresh
  // -------------------------------------------------------------------------

  /** How far down you have to drag before releasing means anything. */
  var PULL_THRESHOLD = 70;

  /** Past this the indicator stops following your finger, so it cannot run away. */
  var PULL_MAX = 110;

  /**
   * Drag down at the top of the page to re-read everything.
   *
   * `appDashboard` was written for this and had no gesture attached to it for
   * three phases: it is the one entry point that calls `forgetLedgerCache_()`
   * before reading, so it is the only way from a phone to say "I do not care
   * what you have cached, go and look". Everything else the app does is happy
   * with a six-hour-old ledger, because every *write* bumps the version.
   *
   * Two conditions, and both matter:
   *
   *   **Only from the very top.** `scrollY > 0` means you are scrolling a list
   *   and a downward drag is how you get back up it. Claiming that gesture
   *   would make the page feel like it was fighting you, for a refresh you
   *   never asked for.
   *
   *   **Only downward, and abandoned the moment it turns horizontal.** The rows
   *   below have their own horizontal gesture, and a pull-to-refresh that ate
   *   the start of a swipe would make confirming a transaction unreliable in
   *   exactly the place you do it most.
   *
   * `passive: true` throughout — this never calls `preventDefault`, because at
   * `scrollY === 0` there is nothing above to scroll to and the browser's own
   * overscroll is the visual feedback we are decorating rather than replacing.
   */
  function installPullToRefresh() {
    var node = document.getElementById('pull');
    var startY = 0;
    var startX = 0;
    var pulling = false;
    var distance = 0;

    var show = function (amount, text) {
      node.hidden = false;
      node.textContent = text;
      node.style.transform = 'translateY(' + (amount - 56) + 'px)';
      node.style.opacity = Math.min(1, amount / PULL_THRESHOLD);
    };

    var hide = function () {
      node.hidden = true;
      node.style.transform = '';
      node.style.opacity = '';
      pulling = false;
      distance = 0;
    };

    document.addEventListener('touchstart', function (event) {
      if (event.touches.length !== 1) return hide();
      if (window.scrollY > 0) return;
      if (state.refreshing) return;

      startY = event.touches[0].clientY;
      startX = event.touches[0].clientX;
      pulling = true;
      distance = 0;
    }, { passive: true });

    document.addEventListener('touchmove', function (event) {
      if (!pulling) return;

      var moveY = event.touches[0].clientY - startY;
      var moveX = event.touches[0].clientX - startX;

      // Upward, sideways, or scrolled away from the top: not this gesture.
      if (moveY <= 0 || Math.abs(moveX) > Math.abs(moveY) || window.scrollY > 0) {
        return hide();
      }

      // Damped past the threshold rather than clamped, so it keeps responding
      // to your finger without the indicator sliding down the whole screen.
      distance = moveY < PULL_THRESHOLD
        ? moveY
        : PULL_THRESHOLD + Math.min(PULL_MAX - PULL_THRESHOLD, (moveY - PULL_THRESHOLD) * 0.4);

      show(distance, distance >= PULL_THRESHOLD ? 'Release to refresh' : 'Pull to refresh');
    }, { passive: true });

    document.addEventListener('touchend', function () {
      if (!pulling) return;

      var fired = distance >= PULL_THRESHOLD;
      if (!fired) return hide();

      show(PULL_THRESHOLD, 'Refreshing\u{2026}');
      state.refreshing = true;

      // Everything, not just the dashboard: a pull is the gesture for "this is
      // stale", and refreshing only the screen behind the indicator would leave
      // the other two exactly as wrong as they were.
      invalidate();
      loadDashboard();
      refreshCurrentScreen();

      // Nothing here returns a promise the gesture can wait on — `loadDashboard`
      // renders when it lands — so the indicator is dismissed on a timer rather
      // than pretending to know. Long enough to be legible, short enough not to
      // sit there after the screen has already redrawn beneath it.
      setTimeout(function () {
        state.refreshing = false;
        hide();
      }, 900);
    }, { passive: true });

    document.addEventListener('touchcancel', hide, { passive: true });
  }

  // -------------------------------------------------------------------------
  // Loading and drawing
  // -------------------------------------------------------------------------

  /**
   * Everything the client holds is now a claim about the past.
   *
   * Clearing `state.cache` alone was the bug, and it looked like it worked.
   * That object holds analytics payloads and nothing else, keyed by filter
   * signature — but `go()` only re-enters a loader when `state.data.analytics`
   * is null or `state.records.loaded` is false, and neither was touched. So
   * the cleared entry was never consulted, because the code that would have
   * read it was never reached. A confirmation moved the number on the server,
   * the server was right, and the phone went on drawing the number it already
   * had until the tab was killed and reloaded.
   *
   * This *marks* rather than fetches. The screen you are looking at is the
   * caller's problem — see `reloadAfterWrite` — and the other two are picked
   * up by `go()` the next time you visit them, which costs nothing until then.
   */
  function invalidate() {
    state.cache = {};
    state.data.analytics = null;
    state.records.loaded = false;
  }

  /**
   * What to re-read after the app has written something.
   *
   * The dashboard always, because every write moves a number on it and it is
   * the screen you land back on. Beyond that this deliberately **does not**
   * refetch Records, even though Records is now marked stale: `loadRecords`
   * starts again from offset zero, so someone who had paged four hundred rows
   * deep to find one transaction would be thrown back to the first hundred by
   * the act of confirming it. The local row was already patched optimistically
   * and that patch is correct; the stale mark is what makes the next filter
   * change or tab switch fetch the truth.
   *
   * `refreshCurrentScreen` covers the one case where the screen in front of
   * you is genuinely wrong rather than merely old — Charts, whose totals just
   * changed and which holds no per-row state to lose.
   */
  function reloadAfterWrite() {
    invalidate();
    loadDashboard();
    if (state.screen === 'analytics') loadAnalytics();
  }

  function currentFilters(which) {
    var filters = state.filters[which];
    return {
      period: filters.period,
      account: filters.account,
      label: filters.label,
      search: filters.search || '',
      unconfirmedOnly: !!filters.unconfirmedOnly,
      // Sent from both screens, ignored by `webAppAnalytics_`. Charts never
      // sets them and reading them there would be a filter with no control.
      spendOnly: !!filters.spendOnly,
      category: filters.category || 'All',
      subcategory: filters.subcategory || 'All'
    };
  }

  /**
   * Every filter change lands here, which is why the URL is written here.
   *
   * `go` covers the other half — the screen changing — and between them there
   * is no way to alter what is on screen without the address bar hearing about
   * it. That matters more than it looks: a URL that is right most of the time
   * is one you cannot trust enough to bookmark.
   */
  function refreshCurrentScreen() {
    rememberView();
    render();
    if (state.screen === 'analytics') loadAnalytics();
    if (state.screen === 'records') loadRecords();
  }

  function loadAnalytics() {
    var filters = currentFilters('analytics');
    var key = 'analytics:' + signature(filters);
    if (state.cache[key]) {
      state.data.analytics = state.cache[key];
      return render();
    }

    state.data.analytics = null;
    render();

    call('appAnalytics', filters).then(function (result) {
      state.cache[key] = result;
      state.data.analytics = result;
      render();
    }).catch(fail);
  }

  function loadRecords() {
    // Clear the rows, not just set the flag. This is a fresh query from offset
    // zero, so what is on screen belongs to the *previous* filter — and the
    // spinner only shows on an empty list, so leaving them there meant a filter
    // change repainted the old answer with no sign anything was happening.
    // `loadMoreRecords` is the one that must keep them: it appends.
    state.records = { rows: [], pending: [], offset: 0, hasMore: false, total: 0,
      loading: true, loaded: false };
    render();

    call('appRecords', currentFilters('records'), 0).then(function (result) {
      state.records = { rows: result.rows, pending: result.pending || [],
        offset: result.rows.length,
        hasMore: result.hasMore, total: result.total, loading: false, loaded: true };
      render();
    }).catch(fail);
  }

  function loadMoreRecords() {
    state.records.loading = true;
    render();

    call('appRecords', currentFilters('records'), state.records.offset).then(function (result) {
      state.records.rows = state.records.rows.concat(result.rows);
      state.records.offset += result.rows.length;
      state.records.hasMore = result.hasMore;
      state.records.total = result.total;
      state.records.loading = false;
      render();
    }).catch(fail);
  }

  /**
   * Re-read the dashboard after a write, through the call that drops the cache.
   *
   * One call rather than the two the boot makes: this runs after you have
   * already been looking at the screen, so there is no first paint left to
   * win, and the write that prompted it has bumped the data version anyway.
   * The result is the union of both halves, distributed back into them.
   */
  function loadDashboard() {
    call('appDashboard').then(function (result) {
      // `assetAccounts` carries balances rather than names, so it is refetched
      // with them rather than kept — see the note on `lists` in appDashboard.
      state.lists.accounts = result.lists.accounts;
      state.lists.cashAccounts = result.lists.cashAccounts;
      state.lists.assetAccounts = result.lists.assetAccounts || [];

      state.data.open = {
        currency: result.currency,
        netWorth: result.netWorth,
        accounts: result.accounts,
        lists: result.lists,
        generatedAt: state.data.generatedAt
      };
      state.data.overview = {
        month: result.month,
        health: result.health,
        review: result.review,
        pending: result.pending || [],
        lists: state.data.overview ? state.data.overview.lists : state.lists
      };
      state.overviewError = '';
      render();
    }).catch(fail);
  }

  function fail(error) {
    state.records.loading = false;
    toast(error.message);
    render();
  }

  function go(id) {
    state.screen = id;
    rememberView();
    render();
    loadScreenData();
    window.scrollTo(0, 0);
  }

  /**
   * A number on Charts, opened as the rows behind it.
   *
   * **Records' filters are replaced, not merged into.** Whatever was set there
   * belongs to a different question — a search you typed last week, `needs
   * review` left on — and any of it surviving would produce a list that no
   * longer sums to the figure you tapped. That reconciliation is the entire
   * point of the drill, so everything the server can filter on is stated here
   * rather than inherited: the three period/account/label answers copied from
   * Charts, the drill itself, and the other two explicitly off.
   *
   * `period` is copied by reference, which is safe because `filterBar` replaces
   * the object rather than mutating it — except for `custom`, where the two date
   * inputs write into `filters.period[edge]`. Cloned for that one case, so
   * editing the range on Records cannot reach back into Charts.
   *
   * `loaded` is cleared before `go`, because `go` fetches only when it is false
   * and the rows on screen belong to the old filters.
   */
  function drillToRecords(drill) {
    var from = state.filters.analytics;
    state.filters.records = {
      period: from.period && from.period.kind === 'custom'
        ? { kind: 'custom', from: from.period.from, to: from.period.to }
        : from.period,
      account: from.account,
      label: from.label,
      search: '',
      unconfirmedOnly: false,
      spendOnly: !!drill.spendOnly,
      category: drill.category || 'All',
      subcategory: drill.subcategory || 'All'
    };

    state.records.loaded = false;
    go('records');
  }

  /**
   * Whatever the screen in front of you still needs, and nothing it has.
   *
   * Called by `go` and again once `appOverview` lands, because those are the
   * two ways a screen becomes the current one: tapped, or asked for by the URL
   * before there was anything to draw. The guards are what make the second call
   * free — a deep link to Records finds the rows `appOverview` seeded and asks
   * for nothing, and a boot onto the dashboard is a pair of no-ops.
   *
   * Charts is the one that does cost a round trip on a deep link, and it has to
   * wait for `appOverview` rather than firing alongside it: **the server owns
   * the default filters**, `appOverview` is what delivers them, and a fetch
   * keyed on the page's guess would cache a slice under the wrong signature.
   * That is the same two-trip cost as opening the app and tapping Charts.
   */
  function loadScreenData() {
    if (state.screen === 'analytics' && !state.data.analytics) loadAnalytics();
    if (state.screen === 'records' && !state.records.loaded) loadRecords();
  }

  function render() {
    var root = clear(document.getElementById('screens'));
    var screen = SCREENS.filter(function (entry) { return entry.id === state.screen; })[0];
    screen.render(root);

    var tabs = clear(document.getElementById('tabs'));
    SCREENS.filter(function (entry) {
      return NAV.indexOf(entry.id) !== -1;
    }).forEach(function (entry) {
      var button = el('button');
      button.type = 'button';
      if (entry.id === state.screen) button.setAttribute('aria-current', 'page');
      add(button, el('span', 'glyph', entry.glyph));
      add(button, document.createTextNode(entry.label));
      button.addEventListener('click', function () { go(entry.id); });
      add(tabs, button);
    });
  }

  /**
   * Two calls, fired together, drawn as they land.
   *
   * This was one call, and before that one call carrying Charts and Records
   * too — a boot that read the ledger three times for screens you might never
   * open. Removing the prefetch was right and it was not enough: the remaining
   * call still bundled the cheap half of the dashboard with the expensive one,
   * so net worth and the tiles waited ~1,600ms on a ledger they do not use.
   *
   * In parallel, and that was settled by measuring rather than by reasoning.
   *
   * They were briefly made sequential, on the theory that two executions
   * reading the same spreadsheet contend and the cheap call would not finish
   * first anyway. The evidence for it was "the whole screen arrives at once" —
   * observed on a deployment that turned out to predate the split entirely and
   * was making a single call. An inference drawn from a build that could not
   * have staged anything.
   *
   * Measured against the live app, in one session, both orders back to back:
   *
   *     sequential ... first paint 3,206ms, everything 7,710ms
   *     parallel ..... first paint 3,588ms, everything 3,916ms
   *
   * They do not contend — `appOverview` came back *sooner* running alongside
   * `appOpen` (3,916ms) than after it (4,504ms). Sequential nearly doubles the
   * total and buys nothing.
   *
   * The reason the two are so close is the finding under all of this: a
   * `google.script.run` round trip costs about **2,700ms before any of our
   * code runs** — `appOpen` does ~800ms of work on the server and takes
   * ~3,500ms from here, twice in a row, within 10ms of itself. Overlapping
   * that fixed cost is worth far more than removing server work from either
   * call.
   *
   * A failure before `appOpen` lands is fatal — it carries the gate's verdict
   * and there is nothing to draw without it. A failure after it is not: what
   * is on screen is still true.
   */
  var fatal = function (error) {
    // Which half failed decides what this means, and `state.data.open` is how
    // you tell. Before it lands there is nothing on screen and nothing to say
    // but the error — it carries the gate's verdict, so "Not available" is the
    // likely one. After it lands, net worth and the balances are up and still
    // true, and replacing a working screen with an error would be a lie about
    // what is known.
    if (state.data.open) {
      state.overviewError = error.message;
      return render();
    }

    var root = clear(document.getElementById('screens'));
    add(root, el('h1', null, 'Spendsheet'));
    add(root, add(el('div', 'banner bad'), el('div', null, error.message)));
    add(root, el('p', 'muted',
