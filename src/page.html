<!--
  page.html — the mobile app, in one file.

  The only .html in `src/`, and the only file here that `tests/harness.mjs`
  does not load: `node:vm` runs .gs, and anything inside a page is invisible to
  it. That is the whole reason 21_query.gs and 23_api.gs exist in the shape
  they do — every decision worth testing was pushed to the server, and what is
  left in here is drawing.

  Three rules this file keeps, each of them load-bearing:

  1. **No string is ever assigned as markup.** Every value on this page came
     out of a bank, and a bank's description field is not a thing to trust with
     markup on a Google origin, from where a script can reach
     `google.script.run` and call this project's functions as the deploying
     user. Nodes are created and `textContent` is assigned.

     `tests/manifest.test.mjs` fails on any of the five sinks appearing in an
     HTML file under `src/`, so this is a rule with a guard rather than a rule
     with a comment — and the guard is why this paragraph does not name them.
     The first draft did, and tripped its own check, which is exactly what the
     control-character rule did when it was written out quoting the character
     it warns about. Write the rule, not the token.

  2. **No CDN, no library.** A third-party script in the one page that renders
     bank balances is not worth what it saves. The two charts are hand-drawn:
     CSS bars for the category breakdown, an inline `<svg><polyline>` for the
     two series. Together they are about eighty lines.

  3. **One request per gesture.** Changing a filter costs a round trip;
     toggling what is *shown* costs nothing, because the server sends every
     block in one response. Results are cached against the filter signature, so
     going back to a slice you have already looked at is instant.
-->

<style>
  /*
    Custom properties in both themes, because a page opened at night should not
    be a white rectangle. The phone decides via prefers-color-scheme; there is
    no toggle, because a toggle is a preference to store and this page stores
    nothing.
  */
  :root {
    --bg: #ffffff;
    --surface: #f8f9fa;
    --line: #e8eaed;
    --text: #202124;
    --muted: #5f6368;
    --accent: #1a73e8;
    --bad: #c5221f;
    --bad-bg: #fce8e6;
    --warn: #b06000;
    --warn-bg: #fef7e0;
    --out: #d93025;
    --in: #188038;
    --radius: 12px;
    --tap: 44px;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17181a;
      --surface: #202124;
      --line: #3c4043;
      --text: #e8eaed;
      --muted: #9aa0a6;
      --accent: #8ab4f8;
      --bad: #f28b82;
      --bad-bg: #3b1f1e;
      --warn: #fdd663;
      --warn-bg: #3a2f14;
      --out: #f28b82;
      --in: #81c995;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 15px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-text-size-adjust: 100%;
  }

  /* The tab bar is fixed to the bottom, so the scroll region owes it that much
     plus whatever the phone's home indicator takes. */
  #screens {
    padding: 12px 16px calc(76px + env(safe-area-inset-bottom, 0px));
    max-width: 900px;
    margin: 0 auto;
  }

  h1 { font-size: 20px; margin: 4px 0 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 20px 0 8px; font-weight: 600; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 12px 14px;
    margin-bottom: 10px;
  }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .row + .row { margin-top: 8px; }
  .grow { flex: 1; min-width: 0; }
  .ellipsis { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .muted { color: var(--muted); font-size: 13px; }
  .num { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .big { font-size: 28px; font-weight: 600; }
  .out { color: var(--out); }
  .in { color: var(--in); }
  /* A transfer is neither. It is money you still have, moved — so it takes the
     muted colour rather than the red that says "spent" or the green that says
     "earned". `in_reports` has always excluded these from every total; this is
     the row finally saying so. */
  .moved { color: var(--muted); }

  /* Qualified by `.tile`, and that is the whole of the fix: these set
     `border-left`, `.tile` sets the `border` *shorthand*, and at equal
     specificity the one written later wins — so the edge that marks an account
     whose consent has expired has never once been drawn. It read as working
     because `accountEmoji` puts a red disc on the same tile, so the state was
     visible and only its loudest signal was missing. `.tile.sev2` outranks
     `.tile` on specificity rather than on order, which keeps these two rules
     here beside the other severity colours instead of moving them. */
  .tile.sev1 { border-left: 4px solid var(--warn); }
  .tile.sev2 { border-left: 4px solid var(--bad); }

  .banner { border-radius: var(--radius); padding: 10px 14px; margin-bottom: 10px; }
  .banner.bad { background: var(--bad-bg); color: var(--bad); }
  .banner.warn { background: var(--warn-bg); color: var(--warn); }

  /* The category breakdown. A bar is a div with a width, which on a narrow
     screen beats a pie by a distance — you compare lengths from a common
     baseline rather than angles. */
  .bar-track { height: 6px; background: var(--line); border-radius: 3px; margin-top: 6px; }
  .bar-fill { height: 6px; background: var(--accent); border-radius: 3px; }

  svg { display: block; width: 100%; height: auto; overflow: visible; }
  .axis { stroke: var(--line); stroke-width: 1; }
  .line { fill: none; stroke: var(--accent); stroke-width: 2;
          stroke-linejoin: round; stroke-linecap: round; }
  .barmark { fill: var(--out); }
  .barmark.up { fill: var(--in); }
  .spark { stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; }

  button, select, input, textarea {
    /* 16px rather than `inherit`, which would take the 15px body size. Mobile
       Safari zooms the viewport whenever a field under 16px takes focus, and
       does not zoom back out afterwards — so the app is left scaled and
       horizontally scrolling until you reload it. The Add cash amount field is
       exactly that case and it is the first thing that screen asks for.
       `.chip`, `.seg` and the tab bar set their own smaller size deliberately;
       none of them is a text field, so none of them triggers the zoom. */
    font: 16px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: inherit;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 10px 12px;
    min-height: var(--tap);
    max-width: 100%;
  }
  button { cursor: pointer; }
  button.primary { background: var(--accent); color: var(--bg); border-color: var(--accent);
                   font-weight: 600; width: 100%; }
  button.link { background: none; border: none; color: var(--accent); padding: 8px 0;
                min-height: auto; }

  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  .field { width: 100%; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .filters > * { flex: 1 1 45%; min-width: 130px; }
  .filters > .wide { flex: 1 1 100%; }
  /* A date range is one control with two ends — see `filterBar`. `min-width: 0`
     because a date input has a wide intrinsic width and would otherwise refuse
     to shrink below it, pushing its partner off the row this exists to hold. */
  .filters > .range { display: flex; gap: 8px; }
  .filters > .range > * { flex: 1 1 50%; min-width: 0; }

  /*
    Every control says what it filters.

    Two adjacent dropdowns both reading "All" is not a default, it is a
    guessing game — the value is the same and only the position distinguishes
    them, which is knowledge the screen refuses to show. The `aria-label` was
    already there and was doing this job for a screen reader only.
  */
  /*
    Expense · Income · Transfer, at the top of the transaction sheet.

    Three buttons in a track rather than a `<select>`, for the reason the sheet
    already had to be redesigned over once: iOS opens a select's wheel picker on
    focus. This control is the first thing in the body and has to be readable at
    a glance without being touched at all.

    `flex: 1` on each so the three share the width evenly whatever they say —
    the pressed one is coloured, not resized, because a segment that grew when
    selected would move the other two under a thumb already on its way down.
  */
  .segmented { display: flex; gap: 4px; margin: 14px 0 4px;
               background: var(--line); padding: 3px; border-radius: 999px; }
  .segmented > .seg {
    flex: 1; min-height: 38px; padding: 0 6px; border: none; border-radius: 999px;
    background: none; color: var(--muted); font-size: 14px; font-weight: 600;
  }
  .segmented > .seg[aria-pressed="true"] { background: var(--surface); color: var(--text); }

  .fld { display: flex; flex-direction: column; gap: 3px; }
  .fld > select, .fld > input { width: 100%; }
  .flabel { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
            color: var(--muted); font-weight: 600; padding-left: 2px; }

  /*
    A set of things you can turn on and off, several at a time.

    A `<select multiple>` is the obvious control and is unusable on a phone: iOS
    renders it as a scrolling box with no visible affordance for the modifier
    key it wants, and what you get is a picker that silently replaces your
    selection instead of adding to it. Chips make the state visible without
    being tapped, which is the whole of what a filter has to do.

    `aria-pressed` rather than a class alone, because "on" is the only thing
    distinguishing these and a colour is not a signal everyone receives.
  */
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    border: 1px solid var(--line); background: var(--surface); color: var(--text);
    border-radius: 999px; padding: 7px 12px; font-size: 13px; min-height: 34px;
  }
  .chip[aria-pressed="true"] {
    /* A token, for the reason `button.primary` already uses one: `--accent` is
       a *light* blue in dark mode, so a hard-coded page-white on it measures
       about 2.1:1 — the least legible text in the app, on the one control
       whose entire job is to say which filter is currently on. Written as a
       token and not as a literal, which `tests/manifest.test.mjs` enforces;
       the literal is not named here, because a rule that quotes the thing it
       forbids is the third time that has cost something in this project. */
    background: var(--accent); border-color: var(--accent); color: var(--bg);
  }

  /*
    The drill chips on Records, which are a different kind of chip: an account
    chip is a toggle you press, these report a filter set on another screen and
    the only thing they do is remove it. Hence `.on` rather than
    `aria-pressed` — there is no off state to be in — and the ✕, which says
    "tapping me takes this away" where a filled chip would say the opposite.
  */
  .drills { margin: -4px 0 12px; }
  /* `var(--bg)` for the reason the rule above it now gives: `--accent` is a
     light blue in dark mode, and white on it is 2.1:1. */
  .chip.on { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .chip .x { margin-left: 7px; opacity: .75; }

  /* A row you can act on. 44px is the smallest thing a thumb hits reliably. */
  .tap {
    display: flex; align-items: center; gap: 10px; width: 100%;
    background: none; border: none; border-bottom: 1px solid var(--line);
    padding: 10px 6px; text-align: left; min-height: var(--tap);
  }
  /* Both forms, because a row is now wrapped for the swipe and the wrapper is
     what sits last in the list. Losing this reads as one stray rule under the
     final row of every card. */
  .tap:last-child, .swipe:last-child .tap { border-bottom: none; }
  .dot { width: 8px; height: 8px; border-radius: 4px; background: var(--accent); flex: none; }
  .dot.hidden { visibility: hidden; }

  /*
    Swipe right to confirm.

    The row sits in a clipping wrapper with the green behind it, so dragging the
    row uncovers the action rather than animating a separate thing into place —
    one transform, no second element to keep in sync.

    `touch-action: pan-y` is the load-bearing line. It tells the browser this
    element handles horizontal gestures and vertical ones are still the page's,
    which keeps scrolling native and at 60fps instead of being reimplemented in
    JavaScript. Without it the browser waits to see whether `touchmove` calls
    `preventDefault` before scrolling anything, and the list feels stuck.
  */
  .swipe { position: relative; overflow: hidden; }
  .swipe .tap {
    position: relative; background: var(--surface);
    touch-action: pan-y;
  }
  .swipe.sliding .tap { transition: none; }
  .swipe.springing .tap { transition: transform .18s ease-out; }
  .swipe-action {
    position: absolute; inset: 0; display: flex; align-items: center;
    /* Same fix, same reason — `--in` is a light green in dark mode. */
    padding-left: 18px; font-size: 20px; color: var(--bg);
    background: var(--in); opacity: 0;
  }
  .swipe.armed .swipe-action { opacity: 1; }

  /* A hold the bank has placed but not settled. Not a button and not styled as
     one: there is nothing to confirm and no category to set, because the
     `pending` tab carries none of those columns. The dashed edge says
     "provisional" without needing a legend. */
  .pending-row {
    display: flex; align-items: center; gap: 10px; width: 100%;
    padding: 10px 6px; min-height: var(--tap);
    border-bottom: 1px solid var(--line);
    border-left: 3px dashed var(--muted);
    opacity: .72;
  }
  .pending-row:last-child { border-bottom: none; }
  .pending-note { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                  color: var(--muted); font-weight: 600; }

  /*
    A spinner rather than the word "Loading…".

    A caption that never changes is indistinguishable from a page that has
    stopped, and the slowest moment here is the first paint on a phone that has
    just woken its radio. Motion is the only honest signal that something is
    still happening.

    Reduced motion gets a pulse rather than nothing at all: the preference is
    for less movement, not for losing the one cue that the app is alive.
  */
  .spinner { display: flex; flex-direction: column; align-items: center;
             justify-content: center; gap: 12px; color: var(--muted);
             min-height: 45vh; padding: 24px 4px; }
  .spinner::before {
    content: ''; width: 18px; height: 18px; flex: none; border-radius: 50%;
    border: 2px solid var(--line); border-top-color: var(--accent);
    animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    .spinner::before { animation: pulse 1.4s ease-in-out infinite; }
  }

  /*
    Accounts as tiles rather than a list.

    A list row gives one tap target across the full width, which is fine to
    read and useless to act on. A tile is a thing you press, and pressing an
    account has an obvious meaning — show me what is in it. Two to a row on a
    phone, more on anything wider, so the grid rather than a fixed count.

    The tile is a `div` and the parts you can press are real buttons inside it:
    a cash account carries two different actions, and a button inside a button
    is not something a keyboard or a screen reader can make sense of.
  */
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
           gap: 10px; margin-bottom: 10px; }
  .tile {
    display: flex; flex-direction: column; align-items: stretch;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 12px 14px;
    /* The tile is the tap target — see `accountTile`. */
    cursor: pointer;
  }
  .tile button.face {
    background: none; border: none; border-radius: 0; padding: 0;
    min-height: auto; text-align: left; width: 100%;
    display: flex; flex-direction: column; gap: 2px;
    /* Take the slack a grid row leaves when a neighbour is taller, so the
       button's own hit box matches what the tile now accepts. */
    flex: 1;
  }
  .tile .who { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .tile .amount { font-size: 19px; font-weight: 600; margin-top: 4px; }
  .tile .note { font-size: 12px; }
  .tile button.link { align-self: flex-start; margin-top: 6px; }

  /*
    A category and its subcategories, one list instead of two.

    The two flat blocks counted different things — a row with a category and no
    subcategory sat under its category in one and under "(uncategorised)" in
    the other — and side by side that reads as the app contradicting itself.
    Nested, "(uncategorised)" inside Food & Drink explains itself.
  */
  /*
    The row is a flex container of two buttons: the bar, which opens the
    transactions, and the chevron, which opens the subcategories. `.catdrill`
    carries the chrome-stripping the row itself used to carry when it was the
    button; `.catline` is now only the layout.
  */
  .catline { display: flex; align-items: center; gap: 4px; width: 100%;
             margin-bottom: 10px; }
  .catdrill { display: block; width: 100%; flex: 1; min-width: 0;
              background: none; border: none; border-radius: 0; padding: 0;
              min-height: auto; text-align: left; color: inherit; }
  /* 32px so the chevron is a real touch target beside a bar it must not steal
     taps from — the bar is the common gesture and gets everything else. */
  .catchevron { flex: none; width: 32px; min-height: 32px; padding: 0;
                background: none; border: none; color: var(--muted);
                font-size: 13px; line-height: 1; }
  .children { margin: -2px 0 12px 12px; padding-left: 10px;
              border-left: 2px solid var(--line); }
  .children .bar-fill { opacity: .55; }
  .children .catdrill { margin-bottom: 8px; }

  /*
    The stat cards on Charts: a label, the number, and the shape of it.

    A number alone answers "how much" and says nothing about whether that is
    normal. The thumbnail is too small to read a value off, which is the point
    — it carries the trend, and the full chart below carries the detail.
  */
  .stat { display: flex; align-items: center; gap: 12px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
                 color: var(--muted); font-weight: 600; }
  .stat .value { font-size: 23px; font-weight: 600; }
  .stat .thumb { width: 62px; height: 38px; flex: none; overflow: visible; }

  /* The one stat card with rows behind it. See `statCard`. */
  .stat.tappable { width: 100%; background: none; border: none; border-radius: 0;
                   padding: 0; min-height: auto; text-align: left; color: inherit; }
  .stat .chev { flex: none; color: var(--muted); font-size: 20px; line-height: 1; }

  /*
    Records grouped under the day they happened on.

    A date repeated down every row is a column of near-identical strings you
    read past; as a heading it is read once and orders everything under it.
  */
  .daygroup { margin-bottom: 12px; }
  .dayhead { font-size: 11px; text-transform: uppercase; letter-spacing: .06em;
             color: var(--muted); font-weight: 600; margin: 14px 0 6px 2px; }

  /*
    The category as a coloured disc.

    The colour is derived from the name rather than stored: `categories` has an
    icon column and no colour one, and adding one would be a migration plus a
    thing to maintain for something a hash gives for free and identically on
    every device. The icon carries the meaning; the colour carries the
    at-a-glance grouping.
  */
  .avatar { width: 34px; height: 34px; border-radius: 50%; flex: none;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; position: relative; }
  .avatar .check { position: absolute; right: -3px; bottom: -3px;
                   width: 14px; height: 14px; border-radius: 50%;
                   background: var(--in); border: 2px solid var(--bg); }
  .rec-sub { color: var(--muted); font-size: 13px; }
  .rec-desc { color: var(--muted); font-size: 12px; }

  #tabs {
    position: fixed; left: 0; right: 0; bottom: 0;
    display: flex; background: var(--bg); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    z-index: 10;
  }
  #tabs button {
    flex: 1; border: none; background: none; border-radius: 0;
    padding: 8px 4px; font-size: 11px; color: var(--muted);
  }
  #tabs button[aria-current="page"] { color: var(--accent); font-weight: 600; }
  #tabs .glyph { display: block; font-size: 19px; line-height: 1.3; }

  #toast {
    position: fixed; left: 12px; right: 12px;
    bottom: calc(80px + env(safe-area-inset-bottom, 0px));
    background: var(--text); color: var(--bg);
    padding: 12px 14px; border-radius: 10px; font-size: 14px;
    z-index: 20;
  }
  #toast[hidden] { display: none; }

  /*
    Pull to refresh.

    Fixed rather than in the flow, so nothing below it moves while you drag —
    the list staying still is what makes the indicator read as *over* the page
    rather than as the page stretching. `translateY` and `opacity` are both set
    from JS as the pull grows, so the gesture is continuous rather than a thing
    that appears once you have gone far enough.
  */
  #pull {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    height: 56px; pointer-events: none; z-index: 15;
    color: var(--muted); font-size: 13px;
    transform: translateY(-56px);
  }
  #pull[hidden] { display: none; }

  dialog {
    border: none; border-radius: 16px 16px 0 0; padding: 16px;
    background: var(--bg); color: var(--text);
    width: 100%; max-width: 560px;
    margin: auto auto 0; /* a sheet from the bottom, which is where a thumb is */
    position: relative; /* the anchor for .sheet-close, which is absolute */
  }
  dialog::backdrop { background: rgba(0,0,0,.45); }

  /* The close button is the dialog's *first* child, because `showModal` hands
     focus to the first focusable descendant and the thing that used to be
     first was a <select> — which on iOS opens its wheel picker the instant the
     sheet appears. It is only *drawn* in the corner. Do not move it in the
     markup to move it on screen. */
  .sheet-close {
    position: absolute; top: 4px; right: 4px;
    width: 44px; height: 44px; /* the tap target, not the glyph */
    border: none; background: none; color: var(--muted);
    font-size: 20px; line-height: 1; padding: 0;
  }
  /* Room for it, so a long description does not run under the button. */
  .sheet-body > h2:first-child { padding-right: 44px; }

  .skeleton { color: var(--muted); padding: 24px 4px; }

  /* Above the fold on a laptop, the cards can sit side by side. Everything
     above this point assumed one column, which is the right default for the
     device this was built for. */
  @media (min-width: 700px) {
    .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .cards .card { margin-bottom: 0; }
  }
</style>

<!--
  The first screen, already here.

  Written by `webAppHtml_` from `appInlineBoot_`, and read rather than fetched.
  A `google.script.run` call costs ~2,700ms of Apps Script startup before any
  of our code runs; `doGet` is an execution that has already paid it, so the
  top of the dashboard rides along with the document and draws on parse.

  `type="application/json"` so the browser never executes it, and every `<` in
  the payload is escaped server-side so nothing can close this element early.
  It says `null` if the server could not build it, and the boot below falls
  back to fetching — which is what it did before this existed.
-->
<script type="application/json" id="boot"><?!= boot ?></script>

<!--
  What this URL asked to see — the screen and the filters it was left on. See
  `webAppView_`, which owns the parameter names and every default.

  It rides in an element of its own rather than inside the boot payload above,
  because the two fail independently: `boot` says `null` whenever the inline
  dashboard could not be built, and a deep link must survive that. Same
  `application/json` for the same reason — the browser never executes it, and
  the filter values are the one part of this document that came off the URL.
-->
<script type="application/json" id="view"><?!= view ?></script>

<div id="screens"><div class="spinner">Loading…</div></div>

<nav id="tabs"></nav>
<div id="toast" hidden></div>
<div id="pull" hidden></div>

<script>
(function () {
  'use strict';

  // -------------------------------------------------------------------------
  // Making nodes
  // -------------------------------------------------------------------------

  /**
   * `TX_TYPE.TRANSFER`, spelled once.
   *
   * The server sends `type` on every record and four places here now branch on
   * it. A literal at each of those is four chances to type `transfers` and get
   * a comparison that is silently always false — which would present as
   * transfers drawn in red again, indistinguishable from this never having
   * been built.
   */
  var TRANSFER = 'transfer';

  /**
   * The subcategory a transfer gets when you mark one from the app.
   *
   * `Transfer` is a real category with `kind: transfer` on the `categories`
   * tab, and `typeFormula()` resolves a row's type by looking its category up
   * there — so setting the category *is* setting the type. There is no
   * separate flag to write and deliberately so: a stored type could disagree
   * with the category, and `in_reports` would have to pick one of them.
   */
  var TRANSFER_CATEGORY = 'Transfer';
  var TRANSFER_SUBCATEGORY = 'Between accounts';

  /**
   * What an asset account's value moving is filed as.
   *
   * Under `Transfer` on purpose, so `in_reports` keeps a market gain out of
   * "income this month" while the balance formula's SUMIF and the net-worth
   * curve both still see it. See `renderSetValue`.
   */
  var VALUATION_SUBCATEGORY = 'Valuation change';

  /**
   * "It went somewhere this book does not track."
   *
   * A sentinel and not a blank, because a blank is what an unanswered form
   * looks like and the two mean opposite things — see `TRANSFER_OUTSIDE` on the
   * server, which refuses the blank rather than guessing.
   */
  var TRANSFER_OUTSIDE = '__outside__';

  /**
   * The one way anything gets onto this page.
   *
   * `textContent` for every string, without exception. A bank's description
   * field arrives here unaltered and this page runs on a Google origin, where
   * markup that executes can reach `google.script.run` and call this project's
   * functions as the account holding the bank credentials. Structural beats
   * careful: there is no escaping helper to remember to call, because there is
   * no path that would need one.
   */
  function el(tag, className, text) {
    var node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function add(parent) {
    for (var i = 1; i < arguments.length; i++) {
      if (arguments[i]) parent.appendChild(arguments[i]);
    }
    return parent;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  /** The waiting state, everywhere. The animation is in `.spinner::before`. */
  function spinner(message) {
    return el('div', 'spinner', message || 'Loading…');
  }

  // -------------------------------------------------------------------------
  // Formatting
  // -------------------------------------------------------------------------

  var state = {
    screen: 'dashboard',
    currency: 'EUR',
    lists: { accounts: [], cashAccounts: [], assetAccounts: [], labels: [],
             categories: { parents: [], children: [] }, periods: [] },

    /*
      One filter set per screen, and they open on different periods on purpose.
      Charts answers "how is this month going", so it opens on this month.
      Records is the screen you go to *to find something*, and a ledger that
      searches only the last five days is not a ledger — a search for a shop
      you remember from March returning nothing is worse than slow, because it
      reads as the transaction not being there.
    */
    filters: {
      analytics: { period: { kind: 'mtd' }, account: 'All', label: 'All' },
      records: { period: { kind: 'last_12' }, account: 'All', label: 'All',
                 search: '', unconfirmedOnly: false,
                 // Set only by `drillToRecords`, cleared only by `drillChips`.
                 // No control in the filter bar sets these — the bar is already
                 // five rows tall on a phone, and a filter you can see and
                 // dismiss is the whole of what these need.
                 spendOnly: false, category: 'All', subcategory: 'All' }
    },
    data: {},

    // Keyed by the filter signature, so going back to a slice you have already
    // looked at is instant and costs no request.
    cache: {},
    // `loaded` rather than counting rows. Records is fetched on first
    // navigation now that the bootstrap no longer prefetches it, and a filter
    // that legitimately matches nothing would otherwise look exactly like a
    // screen that has never been opened — so every visit would re-fetch it.
    records: { rows: [], pending: [], offset: 0, hasMore: false, total: 0,
               loading: false, loaded: false },
    // Which account a cash entry is being added to, set by the tile that
    // opened the form and read back by it as the default.
    addAccount: '',
    // Which categories are showing their subcategories. Keyed by name rather
    // than by position, so it survives the list re-ranking under a new filter.
    expanded: {}
  };

  /**
   * Money, in the book's own currency.
   *
   * `Intl` rather than a hand-rolled formatter, because the separator and the
   * symbol's side are locale questions and this page is opened in it-IT. The
   * fallback matters: `Intl` will throw on a currency code it does not know,
   * and `base_currency` is a cell somebody can type into.
   */
  function money(value, options) {
    var opts = options || {};
    if (value === null || value === undefined || value === '') return '—';

    try {
      return new Intl.NumberFormat(undefined, {
        style: 'currency',
        currency: state.currency,
        // Stated, because the default is `"min2"` in it-IT and friends: a
        // thousands separator appears at five digits and is suppressed at
        // four. So the account tiles put `14.500,00 €` beside `8920,40 €` and
        // Charts puts `26.249,82 €` directly above `2988,34 €`. Every amount
        // in this app is set in tabular figures and right-aligned to a common
        // edge, which is a column being lined up digit by digit — and none of
        // that survives separators that come and go with the magnitude.
        useGrouping: true,
        maximumFractionDigits: opts.whole ? 0 : 2,
        minimumFractionDigits: opts.whole ? 0 : 2
      }).format(value);
    } catch (e) {
      return Number(value).toFixed(opts.whole ? 0 : 2) + ' ' + state.currency;
    }
  }

  /** `2026-08-06` as `6 Aug`, because the year is almost never the question. */
  function shortDate(key) {
    if (!key) return '';
    var parts = String(key).split('-');
    var months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun',
                  'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    var month = months[Number(parts[1]) - 1] || parts[1];
    return parts.length > 2 ? Number(parts[2]) + ' ' + month : month + ' ' + parts[0];
  }

  function toast(message) {
    var node = document.getElementById('toast');
    node.textContent = message;
    node.hidden = false;
    clearTimeout(toast.timer);
    toast.timer = setTimeout(function () { node.hidden = true; }, 4000);
  }

  // -------------------------------------------------------------------------
  // Talking to the server
  // -------------------------------------------------------------------------

  /**
   * `google.script.run`, as a promise.
   *
   * The callback form nests badly once a screen needs two things, and every
   * failure path here has to end in a message a person can read — a rejected
   * promise with one `catch` is how that stays true as screens are added.
   */
  function call(name) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function (error) {
          reject(new Error(error && error.message ? error.message : String(error)));
        })[name].apply(null, args);
    });
  }

  /** The filters, as a string, so a result can be cached against them. */
  function signature(filters) {
    return JSON.stringify([filters.period, filters.account, filters.label,
      filters.search || '', !!filters.unconfirmedOnly,
      !!filters.spendOnly, filters.category || 'All', filters.subcategory || 'All']);
  }

  // -------------------------------------------------------------------------
  // Charts, hand-drawn
  // -------------------------------------------------------------------------

  function svgNode(tag, attributes) {
    var node = document.createElementNS('http://www.w3.org/2000/svg', tag);
    Object.keys(attributes || {}).forEach(function (key) {
      node.setAttribute(key, String(attributes[key]));
    });
    return node;
  }

  /**
   * A line, from a series of `{key, value}`.
   *
   * Drawn in a fixed 100×40 viewBox with `preserveAspectRatio="none"`, so the
   * SVG scales to whatever width the card is without any measuring in JS. The
   * stroke would scale with it and go lozenge-shaped, which is what
   * `vector-effect="non-scaling-stroke"` is for.
   *
   * A flat series is centred rather than drawn at the top: dividing by a zero
   * range gives Infinity, and a chart of one repeated value is a real answer
   * (an account nobody has touched all month) rather than an error.
   */
  function lineChart(series) {
    var box = el('div');
    if (!series || series.length < 2) {
      return add(box, el('p', 'muted', 'Not enough days to draw a line yet.'));
    }

    var values = series.map(function (point) { return point.value; });
    var low = Math.min.apply(null, values);
    var high = Math.max.apply(null, values);
    var range = high - low;

    var points = series.map(function (point, i) {
      var x = (i / (series.length - 1)) * 100;
      var y = range === 0 ? 20 : 38 - ((point.value - low) / range) * 36;
      return x.toFixed(2) + ',' + y.toFixed(2);
    }).join(' ');

    var svg = svgNode('svg', {
      viewBox: '0 0 100 40', preserveAspectRatio: 'none',
      role: 'img', 'aria-label': 'Trend from ' + series[0].key + ' to ' + series[series.length - 1].key
    });
    svg.style.height = '120px';

    add(svg, svgNode('line', { x1: 0, y1: 39.5, x2: 100, y2: 39.5, class: 'axis',
      'vector-effect': 'non-scaling-stroke' }));
    add(svg, svgNode('polyline', { points: points, class: 'line',
      'vector-effect': 'non-scaling-stroke' }));

    add(box, svg);

    // Each end labelled with **its own** value. The first draft paired the
    // first date with `low` and the last with `high`, which is right only for
    // a line that happens to be rising: a month where the balance fell showed
    // the starting date next to the lowest figure it reached, which is a
    // caption that contradicts the line above it.
    var first = series[0];
    var last = series[series.length - 1];
    return add(box, add(el('div', 'row'),
      el('span', 'muted', shortDate(first.key) + ' · ' + money(first.value, { whole: true })),
      el('span', 'muted', shortDate(last.key) + ' · ' + money(last.value, { whole: true }))));
  }

  /**
   * Cashflow, as bars from a zero line.
   *
   * Money out below the line and money in above it, because the shape of a
   * month is the question and a signed bar answers it at a glance where two
   * stacked series do not. The zero line moves with the data rather than
   * sitting in the middle: a month with no income at all should not waste half
   * the chart on the space where income would have been.
   */
  function barChart(buckets) {
    var box = el('div');
    if (!buckets || !buckets.length) {
      return add(box, el('p', 'muted', 'Nothing in this period.'));
    }

    var high = 0;
    var low = 0;
    buckets.forEach(function (bucket) {
      high = Math.max(high, bucket.income);
      low = Math.min(low, -bucket.expenses);
    });
    var span = high - low || 1;
    var zero = (high / span) * 40;

    var svg = svgNode('svg', {
      viewBox: '0 0 100 40', preserveAspectRatio: 'none',
      role: 'img', 'aria-label': buckets.length + ' periods of income and spending'
    });
    svg.style.height = '120px';

    var width = 100 / buckets.length;
    buckets.forEach(function (bucket, i) {
      [[-bucket.expenses, 'barmark'], [bucket.income, 'barmark up']].forEach(function (pair) {
        var value = pair[0];
        if (!value) return;
        var height = Math.abs(value / span) * 40;
        add(svg, svgNode('rect', {
          x: (i * width + width * 0.15).toFixed(2),
          y: (value < 0 ? zero : zero - height).toFixed(2),
          width: (width * 0.7).toFixed(2),
          height: Math.max(height, 0.4).toFixed(2),
          class: pair[1]
        }));
      });
    });
    add(svg, svgNode('line', { x1: 0, y1: zero.toFixed(2), x2: 100, y2: zero.toFixed(2),
      class: 'axis', 'vector-effect': 'non-scaling-stroke' }));

    add(box, svg);
    return add(box, add(el('div', 'row'),
      el('span', 'muted', shortDate(buckets[0].key)),
      el('span', 'muted', shortDate(buckets[buckets.length - 1].key))));
  }

  /**
   * A category's icon, from the lists the bootstrap already sends.
   *
   * Looked up by name rather than sent per row, because `byCategory` is keyed
   * by the category name and the icons are a list of about a dozen — joining
   * them on the server would put the same string in the response once per row
   * to save one lookup here. A subcategory falls through to nothing, which is
   * correct: only parents carry an icon that means anything at a glance.
   */
  function categoryIcon(name) {
    var found = state.lists.categories.parents.filter(function (entry) {
      return entry.name === name;
    })[0];
    return found ? found.icon : '';
  }

  /**
   * A *sub*category's icon, which is a different question and a separate list.
   *
   * Deliberately not folded into `categoryIcon`: that one falls through to
   * nothing for a subcategory on purpose, because it feeds the row avatars,
   * where a dozen parent icons are a vocabulary you learn and sixty child ones
   * are noise. The sheet is the opposite case — one row, named in full, where
   * `🛒 Groceries` is the confirmation that you picked the right thing.
   *
   * `children` is the flat list `categoryChoices_` sends, so the names here are
   * unique by construction: a subcategory that named two parents could not
   * resolve through `VLOOKUP` either, which is why the seed has none.
   */
  function subcategoryIcon(name) {
    if (!name) return '';
    var found = state.lists.categories.children.filter(function (entry) {
      return entry.name === name;
    })[0];
    return found ? found.icon : '';
  }

  /**
   * `🛒 Groceries`, or just `Groceries` when the icon column is empty.
   *
   * A helper rather than a ternary at each call site because the empty case is
   * the one that goes wrong: `icon + ' ' + name` with no icon is a name with a
   * leading space, which is invisible in a mockup and shows up as a wobbling
   * left edge down a list of them. `categories.icon` is a cell the user owns
   * and may clear.
   */
  function withIcon(icon, name) {
    return icon ? icon + ' ' + name : String(name || '');
  }

  /**
   * The category breakdown, as bars.
   *
   * The best form on a narrow screen: lengths from a common baseline, read
   * top to bottom, with the label and the number on the same line as the bar
   * rather than in a legend you have to look back and forth to.
   *
   * **The bar opens the transactions; the chevron opens the subcategories.**
   * The bar used to do the expanding, which made the gesture mean two different
   * things depending on whether a category happened to have children — and left
   * the commonest question about a number with no way to ask it. One rule now
   * covers the whole screen: tap a figure, get the rows behind it. Expanding is
   * a second, smaller control, which is the right weight for it.
   *
   * The row is a `div` holding two buttons rather than a button holding one.
   * Nested buttons are invalid and browsers resolve the click by unnesting them
   * in whichever direction they please.
   */
  function categoryBars(rows) {
    var box = el('div');
    if (!rows || !rows.length) {
      return add(box, el('p', 'muted', 'Nothing spent in this period.'));
    }

    var biggest = rows[0].total || 1;
    rows.forEach(function (row) {
      var children = row.children || [];
      var opens = children.length > 0;
      var open = opens && !!state.expanded[row.name];

      var line = el('div', 'catline');

      var drill = el('button', 'catdrill');
      drill.type = 'button';
      drill.setAttribute('aria-label',
        row.name + ' ' + money(row.total) + ', show these transactions');
      drill.addEventListener('click', function () {
        drillToRecords({ spendOnly: true, category: row.name });
      });

      // The icon comes from the `categories` tab, which has carried one since
      // the tab was seeded — the page simply never asked for it. A dozen bars
      // in one colour are told apart by reading every label; with the icon the
      // one you are looking for is found before you read anything.
      var label = el('span', 'grow ellipsis');
      var icon = categoryIcon(row.name);
      if (icon) add(label, el('span', null, icon + ' '));
      add(label, document.createTextNode(row.name));

      add(drill, add(el('div', 'row'), label, el('span', 'num', money(row.total))));

      // The same hue the row's disc gets on Records, so a category looks like
      // itself wherever you meet it. One accent colour for twelve bars meant
      // the label was the only thing telling them apart, which is the work the
      // bar was supposed to be doing.
      var fill = el('div', 'bar-fill');
      fill.style.background = categoryColor(row.name);
      fill.style.width = Math.max(2, (row.total / biggest) * 100).toFixed(1) + '%';
      add(drill, add(el('div', 'bar-track'), fill));

      // A chevron only when there is something to open, for the same reason the
      // whole row used to be a button only then.
      if (!opens) {
        add(box, add(line, drill));
        return;
      }

      var chevron = el('button', 'catchevron', open ? '▾' : '▸');
      chevron.type = 'button';
      chevron.setAttribute('aria-expanded', open ? 'true' : 'false');
      chevron.setAttribute('aria-label',
        (open ? 'Hide' : 'Show') + ' subcategories of ' + row.name);
      chevron.addEventListener('click', function () {
        state.expanded[row.name] = !open;
        render();
      });

      add(box, add(line, drill, chevron));
      if (!open) return;

      // Children are drawn against their *parent's* total, not the biggest
      // category's. The question a drill-down answers is "what is this category
      // made of", and a share of the whole screen cannot answer it — every bar
      // under a small category would be a sliver.
      var kids = el('div', 'children');
      children.forEach(function (child) {
        // Drills with **both** names. A child is unique under its parent and
        // `(uncategorised)` is not unique at all — every category has one — so
        // the pair is what addresses a group. `matchesGroup_` is asked twice
        // on the server for exactly this.
        var kid = el('button', 'catdrill');
        kid.type = 'button';
        kid.style.marginBottom = '8px';
        kid.setAttribute('aria-label', child.name + ' in ' + row.name + ' ' +
          money(child.total) + ', show these transactions');
        kid.addEventListener('click', function () {
          drillToRecords({ spendOnly: true, category: row.name, subcategory: child.name });
        });

        add(kid, add(el('div', 'row'),
          add(el('span', 'grow ellipsis'), document.createTextNode(child.name)),
          el('span', 'num muted', money(child.total))));

        // The parent's hue, not the child's. A subcategory belongs to the
        // category it is nested under, and giving it a colour of its own would
        // say the opposite — the `.children` rule fades it instead.
        var kidFill = el('div', 'bar-fill');
        kidFill.style.background = categoryColor(row.name);
        kidFill.style.width =
          Math.max(2, (child.total / (row.total || 1)) * 100).toFixed(1) + '%';
        add(kid, add(el('div', 'bar-track'), kidFill));
        add(kids, kid);
      });
      add(box, kids);
    });
    return box;
  }

  /**
   * A colour for a category, derived rather than stored.
   *
   * `categories` carries an icon and no colour, and adding a colour column
   * would be a migration plus a thing to keep filled in — for something a hash
   * of the name gives free, stably, and identically on every device. Fixed
   * saturation and lightness so every disc reads at the same weight in both
   * themes; only the hue moves.
   */
  function categoryColor(name) {
    var hash = 0;
    for (var i = 0; i < name.length; i++) hash = (hash * 31 + name.charCodeAt(i)) % 360;
    return 'hsl(' + hash + ', 58%, 47%)';
  }

  // -------------------------------------------------------------------------
  // Screens
  // -------------------------------------------------------------------------

  var SCREENS = [
    { id: 'dashboard', label: 'Home', glyph: '\u{1F3E0}', render: renderDashboard },
    { id: 'records', label: 'Records', glyph: '\u{1F4C4}', render: renderRecords },
    { id: 'analytics', label: 'Charts', glyph: '\u{1F4CA}', render: renderAnalytics },
    { id: 'add', label: 'Add cash', glyph: '\u{2795}', render: renderAdd },
    // Reached from an asset tile only, like `add` from a cash one.
    { id: 'revalue', label: 'Update balance', glyph: '\u{2195}', render: renderSetValue }
  ];

  /**
   * Which screens the tab bar offers, which is no longer all of them.
   *
   * Adding cash used to be a tab, and a tab is a claim about how often you
   * reach for something. You add cash from the account you spent it out of —
   * which is a tile on the dashboard, and which also answers the "into which
   * account" question the form would otherwise open by asking. So the screen
   * stays and the tab goes: `go('add')` still reaches it, from the one place
   * where it is already in context.
   */
  var NAV = ['dashboard', 'records', 'analytics'];

  /**
   * The query string, spelled once. `WEBAPP_VIEW_PARAM` and friends in
   * `20_webapp.gs` are the other half, and the two must agree — this writes
   * what that reads, with nothing in between to catch a drift.
   *
   * **This is not every filter Records has.** The three a drill sets —
   * `spendOnly`, `category`, `subcategory` — are deliberately absent, so a
   * refresh after tapping a number on Charts comes back to Records without the
   * drill. That loses state rather than misreporting it: the chips are drawn
   * from the same filters the query used, so they disappear together and the
   * screen never claims a narrowing it did not apply. Putting them here means
   * three more params, their mirror in `20_webapp.gs`, and `applyUrlFilters`
   * validating a category name against a list — worth doing, not worth doing
   * silently as part of a merge.
   */
  var VIEW_PARAMS = { view: 'v', period: 'p', from: 'from', to: 'to',
                      account: 'a', label: 'l', search: 'q', unconfirmed: 'u' };

  /**
   * What the URL asked for, read once from the document the server built.
   *
   * The screen is validated here as well as on the server, and not because the
   * server's answer is doubted: this reads a DOM element, and the honest
   * failures are a renamed placeholder printing nothing and a template that was
   * never filled. Either one produces a `state.screen` that `render()` cannot
   * find a screen for, which is a blank page rather than a wrong tab.
   *
   * The filters are taken as they come. They are bounded server-side and they
   * are checked against the real lists in `applyUrlFilters`, which is the only
   * place those lists exist.
   */
  function readView() {
    var fallback = { screen: NAV[0], filters: {} };
    try {
      var node = document.getElementById('view');
      var parsed = JSON.parse(String(node ? node.textContent : '').trim() || 'null');
      if (!parsed || typeof parsed !== 'object') return fallback;

      return {
        screen: NAV.indexOf(parsed.screen) === -1 ? NAV[0] : parsed.screen,
        filters: parsed.filters && typeof parsed.filters === 'object'
          ? parsed.filters : {}
      };
    } catch (e) {
      return fallback;
    }
  }

  /** Read at parse, applied at boot, and emptied by `applyUrlFilters` after. */
  var opened = readView();

  /**
   * Put the screen and its filters on the URL, so a refresh comes back to them.
   *
   * This page is inside Apps Script's sandboxed iframe, and `window.location`
   * here is a `userCodeAppPanel` URL that nothing ever reloads — a refresh
   * reloads the *parent*, at `/exec`. `google.script.history` is the one API
   * that reaches it, and it is why this is a query string rather than a hash: a
   * parameter comes back through `doGet` and the page is *served* knowing the
   * answer, where a hash would only be readable after the page had already
   * drawn the wrong thing.
   *
   * `replace` rather than `push`. What was asked for is that a refresh returns
   * you where you were, and pushing an entry per filter change would make the
   * phone's back gesture walk every period you had tried instead of leaving the
   * app — a different feature, and one that needs `setChangeHandler` to be
   * correct rather than merely present.
   *
   * **Only what differs from the default is written.** A URL that spelled out
   * every filter would freeze today's defaults into every bookmark, so the day
   * `appDefaultFilters_` changes its mind about what Records opens on, nothing
   * anyone had saved would hear about it. It also keeps a fresh open at a bare
   * `?v=dashboard`, which is the address that gets added to a home screen.
   *
   * Only the three tab-bar screens, matching `WEBAPP_SCREENS`. `add` and
   * `revalue` are opened *from an account tile* and carry that account in
   * memory only, so naming one would restore a form that had forgotten what it
   * was for. Leaving the URL alone means a refresh from either lands on the
   * screen you opened it from, which is the way back they already offer.
   *
   * Wrapped, because a URL that fails to update is a worse refresh and not a
   * broken app — `google.script.history` exists only in a deployed web app, so
   * this is silently a no-op anywhere else.
   */
  function rememberView() {
    if (NAV.indexOf(state.screen) === -1) return;

    var params = {};
    params[VIEW_PARAMS.view] = state.screen;

    var filters = state.filters[state.screen];
    if (filters) {
      var period = filters.period || {};
      var id = periodId(period);
      if (id) params[VIEW_PARAMS.period] = id;
      // Both ends, and only for `custom` — they are the only part of a period
      // spec that is not recoverable from its id.
      if (period.kind === 'custom') {
        if (period.from) params[VIEW_PARAMS.from] = period.from;
        if (period.to) params[VIEW_PARAMS.to] = period.to;
      }

      // Repeated rather than joined: the account filter is a set, and a
      // separator is a bet that no account is ever named with it in it.
      var accounts = chosenAccounts(filters);
      if (accounts.length) params[VIEW_PARAMS.account] = accounts;

      if (filters.label && filters.label !== 'All') {
        params[VIEW_PARAMS.label] = filters.label;
      }
      if (filters.search) params[VIEW_PARAMS.search] = filters.search;
      if (filters.unconfirmedOnly) params[VIEW_PARAMS.unconfirmed] = '1';
    }

    try {
      if (window.google && google.script && google.script.history) {
        google.script.history.replace(null, params);
      }
    } catch (e) {
      // Nothing to say and nowhere to say it — the screen is already drawn.
    }
  }

  /**
   * The account filter as a list, whatever shape it is in.
   *
   * It is `'All'`, or one name, or an array of them — `accountChips` writes all
   * three and has since it replaced the dropdown. Both the URL writer and the
   * chips need the same normalisation, so it is spelled here once.
   */
  function chosenAccounts(filters) {
    if (Array.isArray(filters.account)) return filters.account.slice();
    return filters.account && filters.account !== 'All' ? [filters.account] : [];
  }

  /**
   * The URL's filters, over the defaults, once there are lists to resolve them.
   *
   * Called from `applyOverview` and nowhere else, because that is the moment
   * `periods` exists: a period id is `mtd` or `year:2024`, and only the list
   * the server sent says which kind and year that is. Anything it cannot
   * resolve is left at the default rather than guessed at — a bookmark naming a
   * period that no longer exists should open on this month, not on a window
   * assembled out of half an id.
   *
   * Returns whether it changed anything, compared through `signature` so that a
   * URL spelling out the default costs no extra fetch. `opened.filters` is
   * emptied on the way out: this is the URL *the document was served for*, and
   * applying it twice would drag you back to it on your second visit to a
   * screen you had since filtered differently.
   */
  function applyUrlFilters() {
    var screen = opened.screen;
    var asked = opened.filters || {};
    var filters = state.filters[screen];
    opened.filters = {};

    if (!filters) return false;
    var before = signature(currentFilters(screen));

    if (asked.period === 'custom') {
      // Both ends or neither. One of them alone resolves to a window whose
      // other edge is today, which is not the range that was bookmarked.
      if (asked.from && asked.to) {
        filters.period = { kind: 'custom', from: asked.from, to: asked.to };
      }
    } else if (asked.period) {
      var entry = (state.lists.periods || []).filter(function (option) {
        return option.id === asked.period;
      })[0];
      // Kept whole, exactly as `filterBar` does: a bare `{kind: 'year'}` with
      // no year in it resolves to the current year, so 2024 would show 2026.
      if (entry) filters.period = { kind: entry.kind, year: entry.year };
    }

    if (asked.accounts && asked.accounts.length) {
      filters.account = asked.accounts.slice();
    }
    if (asked.label) filters.label = asked.label;

    // Records only, and this is not tidiness. Charts draws its filter bar
    // without a search box or a review toggle, so either one set here would
    // narrow every total on the screen with no control saying so and no way to
    // clear it.
    if (screen === 'records') {
      if (asked.search) filters.search = asked.search;
      if (asked.unconfirmed) filters.unconfirmedOnly = true;
    }

    return signature(currentFilters(screen)) !== before;
  }

  /**
   * Draw what has arrived, rather than nothing until everything has.
   *
   * The screen used to be one call and one spinner, so the cheapest half of it
   * — net worth and the tiles, which need no ledger — waited on the most
   * expensive. Server time had come down from ~6,200ms to ~2,400 and the app
   * still felt slow, because **what a person experiences is when the first
   * real content appears, not when the last does.**
   *
   * So `open` and `overview` are fetched at the same time and each block draws
   * as its half lands. `open` is ~800ms and holds the top of the screen; the
   * rest keeps its own spinner until the ledger arrives, in place rather than
   * over the whole page, so nothing that is already on screen moves when it
   * does.
   */
  function renderDashboard(root) {
    var open = state.data.open;
    var data = state.data.overview;
    if (!open) return add(root, spinner());

    add(root, el('h1', null, 'Spendsheet'));

    (data ? data.health : []).forEach(function (alert) {
      var banner = el('div', 'banner ' + (alert.kind === 'consent' ? 'warn' : 'bad'));
      add(banner, el('div', null, alert.subject));
      add(banner, el('div', 'muted', alert.detail));
      add(root, banner);
    });

    // Net worth, then the accounts it is made of.
    //
    // The tiles were briefly first, on the argument that a total is not a thing
    // you can act on. True, and it turns out to be the wrong end to start from:
    // the total is what you open the app to see, and the tiles are what you
    // reach for once it has told you something. Summary then detail, which is
    // the order the rest of this screen already reads in.
    var worth = el('div', 'card');
    add(worth, el('div', 'muted', 'Net worth'));
    add(worth, el('div', 'big num', money(open.netWorth.total)));
    if (open.netWorth.skipped) {
      add(worth, el('div', 'muted',
        open.netWorth.skipped + ' account(s) not counted — either out of net worth, or not in ' +
        open.currency));
    }
    add(root, worth);

    add(root, el('h2', null, 'Accounts'));
    if (!open.accounts.length) {
      add(root, add(el('div', 'card'),
        el('p', 'muted', 'No accounts yet — connect a bank from the Sheet.')));
    } else {
      var tiles = el('div', 'tiles');
      open.accounts.forEach(function (account) {
        add(tiles, accountTile(account, open.currency));
      });
      add(root, tiles);
    }

    // Everything below here needs the ledger. One spinner in the flow, so the
    // blocks above do not move when it resolves.
    if (!data) {
      var pending = el('div', 'card');
      if (state.overviewError) {
        add(pending, el('div', 'muted', state.overviewError));
        add(pending, el('div', 'muted',
          'Net worth and balances above are current. Reload to try the rest again.'));
      } else {
        add(pending, spinner());
      }
      add(root, pending);
      return;
    }

    // The one block on this screen that had no heading, which made it read as
    // a caption on the accounts above rather than as the month. It pairs with
    // "This month, by category" below it — same window, one as three numbers
    // and one as a breakdown — and saying so is most of what the heading buys.
    add(root, el('h2', null, 'This month'));

    var month = el('div', 'card');
    add(month, add(el('div', 'row'),
      el('span', null, 'Spent since ' + shortDate(data.month.from)),
      el('span', 'num out', money(data.month.expenses))));
    add(month, add(el('div', 'row'),
      el('span', null, 'Earned'), el('span', 'num in', money(data.month.income))));
    add(month, add(el('div', 'row'),
      el('span', null, 'Net'),
      el('span', 'num ' + (data.month.net < 0 ? 'out' : 'in'), money(data.month.net))));

    // Month to date against month to date. A comparison that flatters you on
    // the 3rd and alarms you on the 30th is worse than none at all.
    var difference = data.month.expenses - data.month.lastMonthToDate;
    add(month, add(el('div', 'row'),
      el('span', 'muted', 'Same point last month'),
      el('span', 'num muted', money(data.month.lastMonthToDate) +
        '  (' + (difference >= 0 ? '+' : '') + money(difference) + ')')));
    add(root, month);

    add(root, el('h2', null, 'This month, by category'));
    add(root, add(el('div', 'card'), categoryBars(data.month.byCategory)));

    add(root, el('h2', null, 'Needs review'));
    var review = el('div', 'card');
    if (!data.review.length) {
      add(review, el('p', 'muted', 'Nothing waiting — every transaction is confirmed.'));
    }
    data.review.slice(0, 10).forEach(function (record) {
      add(review, recordRow(record));
    });
    if (data.review.length > 10) {
      var more = el('button', 'link', 'See all ' + data.review.length + ' in Records');
      more.addEventListener('click', function () {
        // Changing a filter and then navigating has to *reload*: `go` only
        // fetches when the screen has nothing on it, which after a first visit
        // is never — so without this the list arrives unfiltered and looks
        // like the toggle did nothing.
        state.filters.records.unconfirmedOnly = true;
        go('records');
        loadRecords();
      });
      add(review, more);
    }
    add(root, review);

    // Holds last, under the queue, and this is the second position they have
    // had.
    //
    // They were directly under the balances, on the argument that a hold is the
    // reason a balance is not the number you expected. True, and it put five
    // rows you cannot act on between the tiles and the month — the owner asked
    // for them lower, and the ordering that argument produces is better anyway:
    // everything above is a number or something to do, and this is neither.
    // It is the footnote it reads as.
    //
    // What it deliberately does not claim is that the tiles are wrong by this
    // amount, because that depends on which balance your bank reports:
    // `BALANCE_PREFERENCE` prefers `CLBD`, which is booked and excludes holds,
    // but falls through to `ITAV`, which is available and already nets them.
    // The claim that holds whatever the bank sent is the one made below — these
    // rows are not in `transactions`, so nothing computed from the ledger
    // counts them.
    var held = data.pending || [];
    if (held.length) {
      add(root, el('h2', null, 'Pending'));
      var holds = el('div', 'card');
      var group = el('div', 'daygroup');
      held.slice(0, 5).forEach(function (record) { add(group, pendingRow(record)); });
      add(holds, group);

      if (held.length > 5) {
        var allHolds = el('button', 'link', 'See all ' + held.length + ' in Records');
        allHolds.type = 'button';
        allHolds.addEventListener('click', function () {
          // Clearing the account filter is what makes the label true. Records
          // scopes its own holds to whatever it is filtered to — correctly, and
          // it is why the dashboard carries its own copy — so landing there
          // still filtered to one account would show fewer than the number the
          // button just promised.
          state.filters.records.account = 'All';
          state.filters.records.unconfirmedOnly = false;
          go('records');
          loadRecords();
        });
        add(holds, allHolds);
      }

      add(holds, el('p', 'pending-note',
        'Not settled yet, so no total on this screen counts them'));
      add(root, holds);
    }

    // The two round-trip timings that used to print here are gone. They were
    // instrumentation for the sessions that took the open from ~7s to ~6s, and
    // they earned their place then; what they are now is a line of diagnostics
    // at the bottom of a finance app. `describeDashboardCost` measures the same
    // thing properly, from the menu, part by part, and it always did the half
    // of it that mattered. Profiling the client is Playwright over CDP against
    // the live deployment, which is the only vantage point that can see the
    // ~3,300ms of Google that this line could never include anyway.
  }

  /**
   * An account's state as one character, rather than the word "ok".
   *
   * `accountState_` returns a sentence, and for a healthy account that sentence
   * is "ok" — a word repeated down the screen saying nothing, which is worse
   * than silence because it costs a line to read before you learn that. The
   * emoji carries the same fact pre-attentively: you see the one that is not
   * green without reading anything.
   *
   * Cash gets its own mark rather than a green one. A cash account has no
   * consent and no sync, so `accountState_` gives it severity 0 by definition —
   * calling that "healthy" would be reporting a check that never ran.
   */
  function accountEmoji(account) {
    if (isCashAccount(account.name)) return '\u{1F4B5}';
    if (account.severity === 2) return '\u{1F534}';
    if (account.severity === 1) return '\u{1F7E0}';
    return '\u{1F7E2}';
  }

  /** The server already knows which accounts take cash entries; it sends the list. */
  function isCashAccount(name) {
    return state.lists.cashAccounts.indexOf(name) !== -1;
  }

  /**
   * One account, as something you can press.
   *
   * The tile is a `div` and the two things you can do to it are real buttons
   * inside it. Pressing the face means "show me what is in this account", which
   * is the only question a balance ever prompts; a cash account gets a second,
   * smaller action because it is the only kind you can add to by hand.
   *
   * Nesting a button inside a button would be neither — a keyboard reaches one
   * of them and a screen reader announces something that does not exist.
   *
   * **The whole tile is the target, and the listener is on the tile for that
   * reason rather than on the face.** A button is only as big as its box, and
   * this one is not the tile: the tile's 12/14px padding is outside it, a grid
   * row stretches every tile to match its tallest neighbour and the face does
   * not grow with it, and "+ Add cash" is `align-self: flex-start`, so the
   * space to its right belongs to nothing at all. Four dead strips around a
   * control whose entire job is to be tapped with a thumb.
   *
   * Delegating from the tile fixes all four at once and keeps the button, which
   * is what a keyboard tabs to and what a screen reader announces — its own
   * click bubbles here like any other. The secondary actions are the one
   * exception, and they are excluded by asking where the click landed rather
   * than by `stopPropagation` in each of them: this way a third action added
   * later is a `button.link` and is handled, instead of being a tile that
   * navigates when you meant to press it.
   */
  function accountTile(account, currency) {
    var tile = el('div', 'tile' + (account.severity ? ' sev' + account.severity : ''));

    var face = el('button', 'face');
    face.type = 'button';

    var who = el('div', 'who');
    add(who, el('span', null, accountEmoji(account)));
    add(who, add(el('div', 'ellipsis grow'), document.createTextNode(account.name)));
    add(face, who);

    add(face, el('div', 'amount num', account.balance === null
      ? '—'
      : money(account.balance) +
        (account.currency === currency ? '' : ' ' + account.currency)));

    // Only when it says something. "ok" and "—" are the two answers worth no line.
    if (account.severity) add(face, el('div', 'muted note', account.sync));

    face.setAttribute('aria-label', 'Show records for ' + account.name +
      (account.severity ? '. ' + account.sync : ''));
    add(tile, face);

    tile.addEventListener('click', function (event) {
      // A secondary action inside the tile is itself and not the tile.
      if (event.target.closest && event.target.closest('button.link')) return;

      // Same reload the review queue's "see all" needs: `go` only fetches a
      // screen that has nothing on it, so after a first visit the filter would
      // change and the list would not.
      state.filters.records.account = account.name;
      state.filters.records.unconfirmedOnly = false;
      go('records');
      loadRecords();
    });

    if (isCashAccount(account.name)) {
      var entry = el('button', 'link', '+ Add cash');
      entry.type = 'button';
      entry.addEventListener('click', function () {
        state.addAccount = account.name;
        go('add');
      });
      add(tile, entry);
    }

    // An asset is a wallet you top up by stating the total rather than the
    // change: you read 14,500 off a broker's app, you do not compute the €1,500
    // it moved by. The screen does that subtraction — see `renderSetValue`.
    if (assetAccount(account.name)) {
      var revalue = el('button', 'link', '\u{2195} Update balance');
      revalue.type = 'button';
      revalue.addEventListener('click', function () {
        state.addAccount = account.name;
        go('revalue');
      });
      add(tile, revalue);
    }

    return tile;
  }

  /** The asset entry for a name, or null. Carries its balance — see `assetAccountList_`. */
  function assetAccount(name) {
    return (state.lists.assetAccounts || []).filter(function (entry) {
      return entry.name === name;
    })[0] || null;
  }

  /**
   * How far right you have to drag before the swipe means anything.
   *
   * A fraction of the row rather than a fixed distance, so it feels the same on
   * a 320px phone and a tablet — bounded at both ends, because a quarter of a
   * 900px row is a swipe nobody completes and a quarter of a narrow one is
   * close enough to a stray finger to fire by accident.
   */
  function swipeThreshold(width) {
    return Math.min(96, Math.max(60, width * 0.25));
  }

  /**
   * The distance that decides whether a gesture is a scroll or a swipe.
   *
   * Below this nothing is claimed, because the first few pixels of every
   * gesture are ambiguous and guessing early is what makes a list feel like it
   * fights you.
   */
  var SWIPE_INTENT = 10;

  /**
   * Gestures starting this close to the left edge belong to the browser.
   *
   * iOS puts back-navigation there, and a row that swallowed it would trap
   * someone on a screen. Losing the leftmost 24px of a gesture that has 60px
   * to travel is the cheaper side of that trade.
   */
  var EDGE_GUARD = 24;

  /**
   * Swipe a row right to confirm it.
   *
   * The gesture the whole screen was missing: confirming used to be tap → wait
   * for a sheet → tap Confirm → the sheet closes, three actions and a modal for
   * the answer that is right most of the time. This is one.
   *
   * The row is wrapped rather than restyled, so the green sits *behind* it in a
   * clipping box and dragging uncovers it. One transform moves, and there is no
   * second element whose position has to be kept in step.
   *
   * Five things this has to get right, each of which is a real failure:
   *
   *   **Vertical wins.** The direction is decided once, at `SWIPE_INTENT`, and
   *   a gesture that turns out to be vertical is abandoned for good rather than
   *   re-evaluated — otherwise a diagonal scroll flickers between the two and
   *   the list stutters under your thumb.
   *
   *   **The browser keeps scrolling.** `touch-action: pan-y` hands vertical
   *   panning back to the compositor, so the list scrolls at 60fps without this
   *   code running at all. Reimplementing scroll here would be both slower and
   *   worse.
   *
   *   **The left edge is not ours.** See `EDGE_GUARD`.
   *
   *   **The transform is cleared before anything renders.** `sendDecision`
   *   calls `render()`, which rebuilds `#screens` wholesale — so a row left
   *   mid-transform is not restored, it is destroyed, and the *next* row drawn
   *   into that position inherits nothing. Resetting first keeps the two
   *   independent.
   *
   *   **The click that follows is suppressed.** A completed drag still ends in
   *   a `click`, which would open the sheet on top of the confirmation that
   *   just happened.
   */
  function swipeToConfirm(button, record) {
    var wrap = el('div', 'swipe');
    var action = el('div', 'swipe-action', '\u{2713}');
    action.setAttribute('aria-hidden', 'true');
    add(wrap, action);
    add(wrap, button);

    var startX = 0, startY = 0, dx = 0;
    var horizontal = null, tracking = false;

    var settle = function (animate) {
      wrap.className = 'swipe' + (animate ? ' springing' : '');
      button.style.transform = '';
      dx = 0;
      horizontal = null;
      tracking = false;
    };

    button.addEventListener('touchstart', function (event) {
      // Two fingers is a pinch or a scroll, and neither is this.
      if (event.touches.length !== 1) return settle(false);

      var touch = event.touches[0];
      if (touch.clientX < EDGE_GUARD) return;

      startX = touch.clientX;
      startY = touch.clientY;
      dx = 0;
      horizontal = null;
      tracking = true;
      wrap.className = 'swipe';
    }, { passive: true });

    button.addEventListener('touchmove', function (event) {
      if (!tracking) return;

      var touch = event.touches[0];
      var moveX = touch.clientX - startX;
      var moveY = touch.clientY - startY;

      if (horizontal === null) {
        if (Math.abs(moveX) < SWIPE_INTENT && Math.abs(moveY) < SWIPE_INTENT) return;
        horizontal = Math.abs(moveX) > Math.abs(moveY);
        // Decided once. A gesture that started vertical stays vertical.
        if (!horizontal) {
          tracking = false;
          return;
        }
      }

      // Claimed only now, once the direction is known — before this point the
      // browser must stay free to scroll.
      event.preventDefault();

      // Rightwards only. Left is where a delete would go if there is ever one,
      // and a row that slid both ways would promise an action that does not
      // exist.
      dx = Math.max(0, moveX);
      button.style.transform = 'translateX(' + dx + 'px)';
      wrap.className = 'swipe sliding' +
        (dx >= swipeThreshold(button.offsetWidth) ? ' armed' : '');
    }, { passive: false });

    button.addEventListener('touchcancel', function () { settle(true); }, { passive: true });

    button.addEventListener('touchend', function () {
      if (!tracking || !horizontal) return settle(false);

      var fired = dx >= swipeThreshold(button.offsetWidth);
      // Any completed horizontal drag suppresses its click, not only one that
      // crossed the line — a drag that fell short is still not a tap.
      button.swiped = true;
      settle(true);

      if (!fired) return;
      if (record.confirmed) return toast('Already confirmed.');
      sendDecision(record, { uid: record.uid, confirmed: true });
    }, { passive: true });

    return wrap;
  }

  /**
   * One transaction, as a button.
   *
   * A button rather than a div with a click handler, because a button is what
   * a screen reader announces as actionable and what a keyboard reaches with
   * Tab. The dot on the left is the unconfirmed marker — a shape rather than
   * only a colour, since colour alone is not a signal everyone receives.
   *
   * Returns the *wrapper*, not the button — see `swipeToConfirm`. Callers add
   * whatever comes back and do not reach inside it.
   */
  /**
   * A hold the bank has placed and not yet settled.
   *
   * A `<div>` and not a `<button>`, which is the point rather than a shortcut.
   * There is nothing here to act on: the `pending` tab holds A–O only, so the
   * row has no category to change, no `confirmed` to tick and no `amount_base`
   * to report on — and a control that opens a sheet where every field is blank
   * is worse than no control. It is not focusable and carries no click or touch
   * handler, so the swipe cannot reach it either.
   *
   * The amount takes no colour. A hold is not yet a fact about your money, and
   * painting it the same red as a settled expense would put it in the same
   * visual sentence as the totals it is deliberately excluded from.
   */
  function pendingRow(record) {
    var row = el('div', 'pending-row');
    row.setAttribute('aria-disabled', 'true');

    var avatar = el('div', 'avatar');
    avatar.style.background = 'var(--line)';
    avatar.setAttribute('aria-hidden', 'true');
    add(avatar, document.createTextNode('\u{1F551}'));
    add(row, avatar);

    var middle = el('div', 'grow');
    add(middle, add(el('div', 'ellipsis'),
      document.createTextNode(record.description || '(no description)')));
    add(middle, el('div', 'rec-sub', record.account));
    add(row, middle);

    add(row, el('span', 'num', record.amount === null ? '\u{2014}' : money(record.amount)));

    row.setAttribute('aria-label', 'Pending. ' + (record.description || '') + ', ' +
      record.account + ', ' + money(record.amount));
    return row;
  }

  function recordRow(record) {
    var button = el('button', 'tap');
    button.type = 'button';

    // What this was, then where it came from, then what the bank called it.
    //
    // The description used to lead, and a bank's description is the least
    // readable field it sends — "ADDEBITO UNIPOLMOVE - N 555012345/2026" tells
    // you nothing at a glance that "Transport" does not. It stays, third,
    // because it is the only line that distinguishes two rows in the same
    // category on the same day.
    var what = record.subcategory || record.category || '(uncategorised)';

    var avatar = el('div', 'avatar');
    avatar.style.background = categoryColor(record.category || what);
    avatar.setAttribute('aria-hidden', 'true');
    add(avatar, document.createTextNode(categoryIcon(record.category) || ''));
    if (record.confirmed) add(avatar, el('span', 'check'));
    add(button, avatar);

    var middle = el('div', 'grow');
    add(middle, add(el('div', 'ellipsis'), document.createTextNode(what)));
    add(middle, el('div', 'rec-sub', record.account));
    if (record.description) {
      add(middle, add(el('div', 'rec-desc ellipsis'),
        document.createTextNode(record.description)));
    }
    add(button, middle);

    /*
      Red for out, green for in — and neither for a transfer.

      `type` and `inReports` have been on every record `recordForPage_` sends
      since it was written, and this row read neither: the colour came from the
      sign of the amount alone. So moving €2,000 from one of your accounts to
      another drew in exactly the red of spending €2,000, on the screen whose
      whole job is telling you what you spent. The sheet has never been confused
      about this — `in_reports` excludes `type = 'transfer'` from every total —
      so the row was the only thing disagreeing.

      A row excluded from reports for some *other* reason (the `excluded`
      column) is muted too but gets no arrows: it is still an expense, it is
      just one you asked not to count.
    */
    var moved = record.type === TRANSFER;
    var counted = record.inReports !== false;
    var tone = moved || !counted ? 'moved' : (record.amount < 0 ? 'out' : 'in');

    var amount = el('span', 'num ' + tone);
    if (moved) add(amount, document.createTextNode('\u{21C4} '));
    add(amount, document.createTextNode(
      record.amount === null ? '\u{2014}' : money(record.amount)));
    add(button, amount);

    button.setAttribute('aria-label',
