name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a commit SHA rather than a tag, with the tag in a comment.
      # A tag is a movable pointer: whoever controls the action repository can
      # repoint `v7` at new code, and every workflow that trusts it runs that
      # code on the next push — with this repository's contents already checked
      # out. Nothing here holds a secret worth stealing, but the repo is going
      # public and a public workflow is a public example.
      #
      # The cost is that Dependabot-style updates become a real diff you read
      # rather than one you never see. That is the point.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # The .gs files are pasted into Apps Script verbatim, so a stray
      # import/export statement would break at runtime for every user
      # while passing locally. Cheaper to catch here.
      - name: No ES module syntax in src/
        run: |
          if grep -nE '^\s*(import|export)\s' src/*.gs; then
            echo "::error::src/*.gs must be plain Apps Script — no import/export."
            exit 1
          fi

      - name: No private keys committed
        run: |
          if git ls-files | grep -E '\.(pem|key)$'; then
            echo "::error::A key file is tracked in git."
            exit 1
          fi

      # The check above only knows about filenames, and a key does not have to
      # arrive as a .pem to be a key — pasted into a .gs while debugging, or
      # into a test fixture, it passes cleanly. This looks for the material
      # itself: a line that is nothing but base64 is what a PEM body is, and
      # nothing legitimate in this repo has one. Deliberately not a grep for
      # "BEGIN PRIVATE KEY", which the credentials dialog and the validator
      # tests both contain as placeholder text.
      - name: No private key material committed
        run: |
          if git ls-files -z | xargs -0 grep -nE '^[A-Za-z0-9+/]{40,}={0,2}$'; then
            echo "::error::A line of base64 key material is tracked in git."
            exit 1
          fi

  # A job of its own rather than a step on the one above, for two reasons. The
  # two suites are independent — nothing in `npm test` produces anything the
  # browser run consumes — so as separate jobs they run at the same time and the
  # wall clock is the slower of the two rather than their sum. And they fail for
  # different reasons: a red `test` is the logic, a red `e2e` is the page, and a
  # combined job would report both as one line saying neither.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The browser is ~90MB and the download is most of this job, so it is
      # cached — keyed on the Playwright version, which is what decides the
      # browser revision. Read from the lockfile rather than written here: a key
      # naming a version by hand goes stale on the upgrade that most needs a
      # fresh browser, and does it by serving a hit.
      - name: Resolve the Playwright version
        id: playwright
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browser
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-webkit-${{ steps.playwright.outputs.version }}

      # WebKit only — see `playwright.config.mjs`. Installing all three would
      # triple both the download and the cache for two engines nothing points at.
      - name: Install WebKit
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit

      # The cache holds the browser; the apt packages it links against live in
      # the image and are not part of it. So a hit still needs this, and
      # skipping it produces a browser that is present and will not start.
      - name: Install the system libraries WebKit links against
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      - run: npm run test:e2e

      # Only on a failure, and this is the one thing that makes a red run here
      # readable: `trace: 'retain-on-failure'` records the DOM at every step, so
      # `npx playwright show-trace` gives you the page as it was rather than a
      # line number. A screenshotless CI failure on a *drawing* bug is a guess.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() && failure() }}
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7
