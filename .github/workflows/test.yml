name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm test

      # The .gs files are pasted into Apps Script verbatim, so a stray
      # import/export statement would break at runtime for every user
      # while passing locally. Cheaper to catch here.
      - name: No ES module syntax in src/
        run: |
          if grep -nE '^\s*(import|export)\s' src/*.gs; then
            echo "::error::src/*.gs must be plain Apps Script — no import/export."
            exit 1
          fi

      - name: No private keys committed
        run: |
          if git ls-files | grep -E '\.(pem|key)$'; then
            echo "::error::A key file is tracked in git."
            exit 1
          fi

      # The check above only knows about filenames, and a key does not have to
      # arrive as a .pem to be a key — pasted into a .gs while debugging, or
      # into a test fixture, it passes cleanly. This looks for the material
      # itself: a line that is nothing but base64 is what a PEM body is, and
      # nothing legitimate in this repo has one. Deliberately not a grep for
      # "BEGIN PRIVATE KEY", which the credentials dialog and the validator
      # tests both contain as placeholder text.
      - name: No private key material committed
        run: |
          if git ls-files -z | xargs -0 grep -nE '^[A-Za-z0-9+/]{40,}={0,2}$'; then
            echo "::error::A line of base64 key material is tracked in git."
            exit 1
          fi
